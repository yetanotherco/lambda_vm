name = "lambda-vm-formal"
defaultTargets = ["LambdaVM", "LambdaVMExport"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Clean from the counted-pulls branch of the yetanotherco fork (on Clean main f3abad7c): pulls of
# multiplicity up to N and soundness by finishing order. Mathlib and CompPoly come in through
# Clean's manifest.
[[require]]
name = "Clean"
git = "https://github.com/yetanotherco/clean"
rev = "1cf67e24816808b880aa6af8592047cf42546efc"

[[lean_lib]]
name = "LambdaVM"

# The export script, so that `lake build` also compiles its dependency `Clean.Circuit.Json`.
[[lean_lib]]
name = "LambdaVMExport"
roots = ["LambdaVM.Export"]
