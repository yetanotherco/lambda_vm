name = "lambda-vm-formal"
defaultTargets = ["LambdaVM", "LambdaVMExport"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Clean from the counted-pulls branch of the yetanotherco fork (on Clean main f3abad7c): pulls of
# multiplicity up to N and soundness by finishing order, plus the four review fixes that answer
# the audit of that branch. Mathlib and CompPoly come in through Clean's manifest.
# Keep `rev` a sha. Clean's own `lakefile.lean` sets `preferReleaseBuild := true` with
# `releaseRepo` pointing at `Verified-zkEVM/clean`, and its comment says a consumer that pins a
# release tag downloads the prebuilt `Clean` library instead of compiling it -- from upstream,
# not from this fork. A tag in the fork is still worth having, as an anchor so the sha survives
# the branch, but it belongs next to this pin, not in it.
[[require]]
name = "Clean"
git = "https://github.com/yetanotherco/clean"
rev = "73309694ae33279094597f7f3f819fb8a3439620"

[[lean_lib]]
name = "LambdaVM"

# The export script, so that `lake build` also compiles its dependency `Clean.Circuit.Json`.
[[lean_lib]]
name = "LambdaVMExport"
roots = ["LambdaVM.Export"]
