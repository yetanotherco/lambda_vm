name = "lambda-vm-formal"
defaultTargets = ["LambdaVM", "LambdaVMExport"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Clean from the counted-pulls branch of the yetanotherco fork (on Clean main f3abad7c): pulls of
# multiplicity up to N and soundness by finishing order, plus the four review fixes that answer
# the audit of that branch. Mathlib and CompPoly come in through Clean's manifest.
[[require]]
name = "Clean"
git = "https://github.com/yetanotherco/clean"
rev = "73309694ae33279094597f7f3f819fb8a3439620"

[[lean_lib]]
name = "LambdaVM"

# The export script, so that `lake build` also compiles its dependency `Clean.Circuit.Json`.
[[lean_lib]]
name = "LambdaVMExport"
roots = ["LambdaVM.Export"]
