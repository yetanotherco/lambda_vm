name = "lambda-vm-formal"
defaultTargets = ["LambdaVM", "LambdaVMExport"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Clean pinned to a revision; Mathlib and CompPoly come in through Clean's manifest.
# PoC: Clean local con pulls contados y orden por cierre de canales (rama counted-pulls).
# La ruta es la del servidor de builds (~/lvc/formal-bump435/formal -> ~/lvc/clean-fork-main).
[[require]]
name = "Clean"
path = "../../clean-fork-main"

[[lean_lib]]
name = "LambdaVM"

# The export script, so that `lake build` also compiles its dependency `Clean.Circuit.Json`.
[[lean_lib]]
name = "LambdaVMExport"
roots = ["LambdaVM.Export"]
