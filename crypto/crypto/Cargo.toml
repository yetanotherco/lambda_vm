[package]
name = "crypto"
description = "Data structures and primitives for cryptography library"
version = "0.1.0"
edition = "2024"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
math = { path = "../math", features = ["alloc"] }
digest = "0.10.7"
sha3 = { version = "0.10.8", default-features = false }
# Optional
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
], optional = true }
rayon = { version = "1.8.0", optional = true }
memmap2 = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
libc = { version = "0.2", optional = true }
# pointer_width_64: proof-format pointer width — see prover/Cargo.toml.
rkyv = { version = "0.8.10", default-features = false, features = [
    "alloc",
    "bytecheck",
    "aligned",
    "pointer_width_64",
], optional = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
lambda-vm-syscalls = { path = "../../syscalls" }

[dev-dependencies]
math = { path = "../math", features = ["test-utils"] }
sha2 = { version = "0.10", default-features = false }
bincode = "1"
# The external anchor for `hash::blake3`: at 7 rounds the compression function
# and `Blake3Chain` up to 1024 bytes are both bit-for-bit this crate. Test-only
# on purpose, and 7-round-only, so it CANNOT become the implementation — the
# variant behind `blake3-6round` is computed by nothing else in the world. Same
# dev-only role it has in `prover` and `math-cuda`.
blake3 = { version = "1.8.5", default-features = false, features = [
    "std",
    "pure",
] }

[features]
default = ["asm", "std"]
asm = ["sha3/asm"]
std = ["math/std", "sha3/std", "serde?/std"]
serde = ["dep:serde"]
parallel = ["dep:rayon"]
disk-spill = ["std", "dep:memmap2", "dep:tempfile", "dep:libc"]
alloc = []
rkyv = ["dep:rkyv", "math/rkyv"]
# `hash::blake3` at the 6-round internal variant instead of the 7-round standard
# one. Off = 7 rounds: standard BLAKE3, externally anchored, carrying no
# unratified assumption. DO NOT INVERT THE POLARITY — every existing measurement
# and the A6R sign-off read "7-round instantiated baseline, 6 behind the feature".
#
# This is the host tree's single round-count knob: `lambda-vm-prover`'s feature
# of the same name forwards to it, so the `LFM_BLAKE3` chip, the `LFM_HASH`
# socket and the commitment backends move together and one build cannot produce
# two hashes. `math-cuda`'s is necessarily separate (it compiles a cubin) and has
# to be set in lockstep with this one; `make lint` has a combined pass that
# exercises both, and `math_cuda::blake3::device_rounds` makes the match
# assertable rather than discoverable as a wrong root.
blake3-6round = []
# Let `Blake3Chain::update` reach the chained-absorb ecall — one call per run of
# whole blocks instead of one per block. Implies `blake3-6round`: the absorb
# accelerator, like the compression one, implements six rounds and nothing else.
#
# ⚠ SEPARATE FROM `blake3-6round` ON PURPOSE, and not for tuning. A guest that
# emits this ecall puts an `Ecall` bus tuple on the bus that only the prover's
# BLAKE3 absorb mode can receive. Until that mode lands, a guest built with this
# feature produces a trace whose LogUp argument cannot balance — a proof that
# fails with no algebraic pointer to the cause. Keeping the guest arm behind its
# own switch means flipping `blake3-6round` to a default cannot turn the absorb
# path on by accident.
blake3-absorb = ["blake3-6round"]