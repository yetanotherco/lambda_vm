[package]
name = "math-cuda"
description = "CUDA-accelerated FFT/NTT for Goldilocks (base field) used by the lambda-vm STARK prover"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
# cudarc CUDA version is PINNED to `cuda-12080` (CUDA 12.8) — do NOT restore
# `cuda-version-from-build-system` + `fallback-latest`. Rationale:
#   * That auto-detect binds the newest symbol set the *build toolkit* knows
#     (e.g. a CUDA 13.1 toolkit pulls in `cuDevSmResourceSplit`, gated behind
#     `cuda-13010`/`cuda-13020`). cudarc eagerly resolves those symbols at CUDA
#     init; a driver that predates them (e.g. 580.x = CUDA 13.0 max) has no such
#     export, so the `dynamic-loading` resolver `.expect()`s and PANICS.
#   * This crate's cudarc surface is entirely CUDA-11-era
#     (CudaContext/CudaFunction/CudaSlice/CudaStream/LaunchConfig/PushKernelArg/
#     DriverError/Ptx — no green contexts). The 12.8 symbol set is a strict
#     subset every >=12.8 driver exports, so pinning it resolves cleanly on any
#     supported driver and a *newer* driver loses nothing we use.
#   * This replaces the fragile per-script `sed` pin in scripts/gpu_test.sh.
# To move the floor (e.g. to use a newer driver-API symbol), bump this one
# feature deliberately — see crypto/math-cuda/build.rs and README "GPU Tests".
cudarc = { version = "0.19", default-features = false, features = [
    "driver",
    "nvrtc",
    "std",
    "cuda-12080",
    "dynamic-loading",
] }
math = { path = "../math" }
rayon = "1.7"
# NVTX range emission for Nsight timelines (dlopen'd at runtime, see src/nvtx.rs).
libloading = { version = "0.8", optional = true }

[features]
# `blake3-6round` is on by default so the cubin's round count matches the host
# tree's, which P-a Stage 6 moved to 6 by default for the same reason. These are
# separate crates' features and the lockstep between them is what makes the
# device and host hashes one hash; defaulting only one of them is precisely the
# mismatch the parity tests would report as a wrong root.
default = ["blake3-6round"]
# Test-only fault injection in FriCommitState. Production builds leave this
# off so the fault check is fully elided at compile time.
test-faults = []
# NVTX bindings for Nsight Systems profiling (ranges are emitted by the
# stark/prover layers). Zero-cost when disabled; when enabled but
# libnvToolsExt is absent at runtime, every call is a cheap no-op.
nvtx = ["dep:libloading"]
# Compile `kernels/blake3.cu` for the 6-round internal BLAKE3 variant instead of
# the 7-round standard one. Same polarity as the host tree's `blake3-6round`
# (on = 6 rounds), and it has to be set in lockstep with it: they are separate
# crates' features and a mismatch is a GPU tree committing under a different hash
# than the CPU one. `blake3::device_rounds` reads the cubin's round count back so
# that is assertable rather than discoverable — see
# `tests/blake3_compress_parity.rs`.
blake3-6round = []

[dev-dependencies]
# 7-round-only, so it can anchor the standard arm of the BLAKE3 kernels and
# nothing else — the same dev-only role it has in `prover/Cargo.toml`.
blake3 = { version = "1.8.5", default-features = false, features = ["std", "pure"] }
crypto = { path = "../crypto" }
rand = { version = "0.8.5", features = ["std"] }
rand_chacha = "0.3.1"
rayon = "1.7"
sha3 = "0.10.8"
stark = { path = "../stark" }
