[package]
name = "math-cuda"
description = "CUDA-accelerated FFT/NTT for Goldilocks (base field) used by the lambda-vm STARK prover"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
# Pin the CUDA API to 13.0 rather than auto-detecting the (13.1) toolkit: a box whose
# driver is 13.0 lacks the 13.1-only `cuDevSmResourceSplit` symbol cudarc would otherwise
# require, panicking at init. 13.0 bindings work on any driver >= 13.0. (Was
# `cuda-version-from-build-system` + `fallback-latest`.)
cudarc = { version = "0.19", default-features = false, features = [
    "driver",
    "nvrtc",
    "std",
    "cuda-13000",
    "dynamic-loading",
] }
math = { path = "../math" }
rayon = "1.7"

[features]
# Test-only fault injection in FriCommitState. Production builds leave this
# off so the fault check is fully elided at compile time.
test-faults = []

[dev-dependencies]
crypto = { path = "../crypto" }
rand = { version = "0.8.5", features = ["std"] }
rand_chacha = "0.3.1"
rayon = "1.7"
sha3 = "0.10.8"
stark = { path = "../stark" }
