[package]
name = "math-cuda"
description = "CUDA-accelerated FFT/NTT for Goldilocks (base field) used by the lambda-vm STARK prover"
version = "0.1.0"
edition = "2024"

[dependencies]
cudarc = { version = "0.19", default-features = false, features = [
    "driver",
    "nvrtc",
    "std",
    "cuda-12080",
    "dynamic-loading",
] }
math = { path = "../math" }
rayon = "1.7"

[dev-dependencies]
rand = { version = "0.8.5", features = ["std"] }
rand_chacha = "0.3.1"
rayon = "1.7"
sha3 = "0.10.8"
