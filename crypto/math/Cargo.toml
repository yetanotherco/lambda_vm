[package]
name = "math"
description = "Modular math library for cryptography"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", default-features = false, features = [
    "derive",
], optional = true }
serde_json = { version = "1.0", default-features = false, features = [
    "alloc",
], optional = true }
proptest = { version = "1.1.0", optional = true }
rand = { version = "0.8.5", default-features = false }

# rayon
rayon = { version = "1.7", optional = true }

# cuda
cudarc = { version = "0.9.7", optional = true }

lambdaworks-gpu = { git = "https://github.com/lambdaclass/lambdaworks.git", optional = true }

# metal (Apple GPU)
metal = { version = "0.29", optional = true }
objc = { version = "0.2", optional = true }
block = { version = "0.1", optional = true }
num-bigint = { version = "0.4.6", default-features = false }
num-traits = { version = "0.2.19", default-features = false }

[dev-dependencies]
rand_chacha = "0.3.1"
criterion = "0.5.1"
const-random = "0.1.15"
iai-callgrind = "0.3.1"
proptest = "1.1.0"
pprof = { version = "0.13.0", features = ["criterion", "flamegraph"] }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3" }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3" }
p3-field = { git = "https://github.com/Plonky3/Plonky3" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3" }
rand = { version = "0.8.5", features = ["std"] }

[features]
default = ["parallel", "std"]
std = ["alloc", "serde?/std", "serde_json?/std"]
alloc = []
parallel = ["dep:rayon"]
lambdaworks-serde-binary = ["dep:serde", "alloc"]
lambdaworks-serde-string = ["dep:serde", "dep:serde_json", "alloc"]
proptest = ["dep:proptest"]
instruments = []

# assembly optimizations
asm-arm64 = []  # ARM64 assembly optimizations for Apple Silicon (M1/M2/M3)

# gpu
cuda = ["dep:cudarc", "dep:lambdaworks-gpu"]
metal = ["dep:metal", "dep:objc", "dep:block", "alloc"]

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2.15", features = ["js"] }

[[bench]]
name = "field_ops_benchmark"
harness = false

[[bench]]
name = "fft_benchmark"
harness = false

[[bench]]
name = "asm_benchmark"
harness = false