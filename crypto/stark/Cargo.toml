[package]
name = "stark"
version = "0.1.0"
edition = "2024"

[dependencies]
lambdaworks-math = {git = "https://github.com/lambdaclass/lambdaworks.git", features = [
    "std",
    "lambdaworks-serde-binary",
] }
lambdaworks-crypto = {git = "https://github.com/lambdaclass/lambdaworks.git", features = ["std", "serde"] }
rand = "0.8.5"
thiserror = "1.0.38"
log = "0.4.17"
bincode = { version = "2.0.1", features = ["serde"] }
sha3 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-integer = "0.1.45"
itertools = "0.11.0"

# Parallelization crates
rayon = { version = "1.8.0", optional = true }

# wasm
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.5", optional = true }
web-sys = { version = "0.3.64", features = ['console'], optional = true }
serde_cbor = { version = "0.11.1" }

[dev-dependencies]
hex = "0.4.3"
criterion = { version = "0.4", default-features = false }
env_logger = "*"
test-log = { version = "0.2.11", features = ["log"] }
assert_matches = "1.5.0"
rstest = "0.17.0"
rand = "0.8.5"
wasm-bindgen-test = "0.3.0"

[features]
test_fiat_shamir = []
instruments = []                                                     # This enables timing prints in prover and verifier
parallel = ["dep:rayon", "lambdaworks-crypto/parallel"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:web-sys"]

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
proptest = "1.2.0"
