[package]
name = "stark"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
math = { path = "../math", features = [
    "std",
    "lambdaworks-serde-binary",
    "rkyv",
] }
crypto = { path = "../crypto", features = ["std", "serde", "rkyv"] }
thiserror = "1.0.38"
log = "0.4.17"
digest = "0.10.7"
serde = { version = "1.0", features = ["derive"] }
itertools = "0.11.0"
rkyv = { version = "0.8.10", default-features = false, features = ["alloc", "bytecheck", "aligned"] }

# Parallelization crates
rayon = { version = "1.8.0", optional = true }

memmap2 = { version = "0.9", optional = true }
tempfile = { version = "3", optional = true }
libc = { version = "0.2", optional = true }

# GPU backend for trace LDE — only linked when `cuda` is enabled.
math-cuda = { path = "../math-cuda", optional = true }

# wasm
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.5", optional = true }
web-sys = { version = "0.3.64", features = ['console'], optional = true }
serde_cbor = { version = "0.11.1" }

# Guest-only: the DEEP reduced-opening measurement stubs (sim-ro-ecalls /
# sim-ro-query) call ecall wrappers from the syscalls crate. Only referenced by
# riscv64-cfg'd + feature-gated code, so host builds never see it (mirrors
# crypto/crypto's platform_keccak wiring).
[target.'cfg(target_arch = "riscv64")'.dependencies]
lambda-vm-syscalls = { path = "../../syscalls" }

[dev-dependencies]
math = { path = "../math", features = ["test-utils"] }
criterion = { version = "0.4", default-features = false }
env_logger = "*"
test-log = { version = "0.2.11", features = ["log"] }
bincode = "1"
rand = { version = "0.8.5", features = ["std"] }
rand_chacha = "0.3.1"

[features]
test-utils = []
test_fiat_shamir = []
instruments = []                                                     # This enables timing prints in prover and verifier
profile-markers = []                                                 # Emits inlining-immune asm markers for guest step profiling
debug-checks = []                                                    # Enables validate_trace + bus balance report in prover
parallel = ["dep:rayon", "crypto/parallel"]
cuda = ["dep:math-cuda"]
test-cuda-faults = ["cuda", "math-cuda/test-faults"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:web-sys"]
disk-spill = ["dep:memmap2", "dep:tempfile", "dep:libc", "crypto/disk-spill"]

# MEASUREMENT-ONLY (never prove a build with these on). Swap the DEEP
# reduced-opening hot loop for a trusted 1-cycle ecall to measure its cycle
# ceiling. `sim-ro-ecalls` = Level A (per-(query×row) column loop);
# `sim-ro-query` additionally fuses to Level B (whole per-query pair). Only
# effective on the riscv64 recursion guest; a no-op on host builds.
sim-ro-ecalls = []
sim-ro-query = ["sim-ro-ecalls"]
# ROUND-2 increment C: the in-place reduced-opening ABI. A variant of Level A
# (`sim-ro-ecalls`) that registers the proof-constant layout ONCE via
# REGISTER_RO_LAYOUT, then per-row passes only {row_idx, eval-slice ptrs} to
# REDUCED_OPENING_ROW_INPLACE — killing the per-query struct fill + col-ptr
# gather. Use INSTEAD OF sim-ro-ecalls (mutually exclusive row-loop swap).
# EXECUTE-ONLY: never prove.
sim-ro-inplace = []
# MID-LEVEL accelerator measurement stubs (sim/27). MEASUREMENT-ONLY, never
# prove. `sim-poly-eval` swaps the FRI terminal-codeword FFT for the SIM_POLY_EVAL
# host ecall (Horner at only the queried positions); `sim-fold-chain` swaps the
# per-query FRI fold butterfly chain for SIM_FOLD_CHAIN (the guest keeps the
# per-layer Merkle checks and the terminal compare). Each forwards to its syscalls
# wrapper on riscv64; a no-op on host builds.
sim-poly-eval = ["lambda-vm-syscalls/sim-poly-eval"]
sim-fold-chain = ["lambda-vm-syscalls/sim-fold-chain"]
# sim/34: verify every committed FRI layer's Merkle opening for one query in one
# SIM_VERIFY_PATH_BATCH ecall (subsumes the per-layer HASH_FELTS + VERIFY_PATH).
# Requires `sim-fold-chain` (it consumes the folded layer values). EXECUTE-ONLY.
sim-verify-path-batch = ["lambda-vm-syscalls/sim-verify-path-batch", "sim-fold-chain"]
# sim/31: swap the per-query FRI evaluation-point `pow` for one batched
# SIM_DOMAIN_POINTS host ecall. Forwards to the syscalls wrapper on riscv64.
sim-domain-points = ["lambda-vm-syscalls/sim-domain-points"]
# Stub 4 op-count PROXY (not an offload): tally per-table constraint counts at
# the `compute_transition` site. The guest still runs the real evaluation — the
# constraint-eval ceiling is not offloadable in the executor-host model.
sim-constraint-eval = ["lambda-vm-syscalls/sim-constraint-eval"]


[package.metadata.wasm-pack.profile.dev]
# Should `wasm-opt` be used to further optimize the wasm binary generated after
# the Rust compiler has finished? Using `wasm-opt` can often further decrease
# binary size or do clever tricks that haven't made their way into LLVM yet.
#
# Configuration is set to `false` by default for the dev profile, but it can
# be set to an array of strings which are explicit arguments to pass to
# `wasm-opt`. For example `['-Os']` would optimize for size while `['-O4']`
# would execute very expensive optimizations passes
wasm-opt = ['-O']

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
# Should we enable wasm-bindgen's debug assertions in its generated JS glue?
debug-js-glue = true
# Should wasm-bindgen demangle the symbols in the "name" custom section
demangle-name-section = true
# Should we emit the DWARF debug info custom sections
dwarf-debug-info = false
# Should we omit the default import path
omit-default-module-path = false

[[example]]
name = "examples_cli"
required-features = ["test-utils"]

[[bench]]
name = "prover_benchmark"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "profile_prover"
harness = false
required-features = ["test-utils"]
