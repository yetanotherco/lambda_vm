[package]
name = "cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
executor = { path = "../../executor" }
prover = { path = "../../prover", package = "lambda-vm-prover" }
stark = { path = "../../crypto/stark" }
clap = { version = "4.3.10", features = ["derive"] }
rkyv = { version = "0.8.10", default-features = false, features = ["alloc", "bytecheck", "aligned"] }
tempfile = "3"
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"], optional = true }
env_logger = "0.11"

[features]
jemalloc-stats = ["dep:tikv-jemalloc-ctl"]
disk-spill = ["prover/disk-spill"]
instruments = ["prover/instruments", "stark/instruments"]
nvtx = ["prover/nvtx", "stark/nvtx", "instruments"]
