[package]
name = "cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
executor = { path = "../../executor" }
prover = { path = "../../prover", package = "lambda-vm-prover" }
stark = { path = "../../crypto/stark" }
clap = { version = "4.3.10", features = ["derive"] }
# pointer_width_64: proof-format pointer width — see prover/Cargo.toml.
rkyv = { version = "0.8.10", default-features = false, features = ["alloc", "bytecheck", "aligned", "pointer_width_64"] }
tempfile = "3"
tikv-jemallocator = "0.6"
# The allocator's statistics and `arena.<all>.purge`, installed into the
# prover as its `alloc_purge` hooks: the block's purge points, its memory
# ledger and the tree's late leaf emission read the binary's allocator.
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
tikv-jemalloc-sys = { version = "0.6", default-features = false }
# `prove-block --digest`: the proof bytes' blake3, the digest the box gates
# compare (the prover's tests print the same).
blake3 = { version = "1.8.5", default-features = false, features = ["std", "pure"] }
env_logger = "0.11"

[features]
# The GPU prover: `prove-block` needs it (the block tree proves on the card).
cuda = ["prover/cuda"]
jemalloc-stats = []
disk-spill = ["prover/disk-spill"]
instruments = ["prover/instruments", "stark/instruments"]
# Emit a segment-shape profile per proof (see LAMBDA_VM_SHAPE_PROFILE).
shape-profile = ["prover/shape-profile"]
# GPU profiling build (Nsight): CUDA prover + instruments spans + NVTX ranges.
nvtx = ["prover/nvtx", "instruments"]
