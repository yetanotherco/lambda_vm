[package]
name = "ethrex-fixtures"
version = "0.1.0"
edition = "2024"

# Detached workspace: keeps the heavy ethrex host deps out of the main build.
[workspace]

[dependencies]
# Pinned to the SAME ethrex rev as the guest so generated SSZ inputs match what
# the stateless guest deserializes.
ethrex-blockchain = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-blockchain" }
ethrex-storage = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-storage" }
ethrex-common = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-common" }
ethrex-guest-program = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-guest-program" }
ethrex-l2-rpc = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-l2-rpc" }
ethrex-rlp = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-rlp" }
# Walking the witness tries: the storage keys are `keccak(slot)`, so recovering a
# genesis-shaped alloc from a witness needs the node types, not just the accessors.
ethrex-trie = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-trie" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Exact pin: keep the SSZ implementation in sync with the guest's ethrex rev.
libssz = "=0.3.0"
libssz-types = "=0.3.0"
serde_json = "1"
bytes = "1"
secp256k1 = "0.30"
hex = "0.4"
