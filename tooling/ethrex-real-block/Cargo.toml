[package]
name = "ethrex-real-block"
version = "0.1.0"
edition = "2024"

# Detached workspace: keeps the heavy ethrex host deps out of the main build.
[workspace]

[dependencies]
# Pinned to the SAME ethrex rev as the guest (open LambdaVM-backend PR branch)
# so the generated ProgramInput rkyv layout matches what the guest deserializes.
ethrex-common = { git = "https://github.com/lambdaclass/ethrex.git", rev = "156cb8d6a3974f411d71622eecd1b249ee37ff1c", package = "ethrex-common", default-features = false }
ethrex-config = { git = "https://github.com/lambdaclass/ethrex.git", rev = "156cb8d6a3974f411d71622eecd1b249ee37ff1c", package = "ethrex-config", default-features = false }
# `default-features = false, features = ["lambdavm"]` mirrors the guest
# (executor/programs/rust/ethrex/Cargo.toml) exactly, so the parity test below
# executes the block against the same precompile surface the guest has — most
# importantly WITHOUT KZG, which `lambdavm` does not link (only `sp1` pulls
# `ethrex-crypto/kzg-rs`). Under the default `secp256k1` feature the test would
# silently exercise a richer set of precompiles than the guest actually ships.
ethrex-guest-program = { git = "https://github.com/lambdaclass/ethrex.git", rev = "156cb8d6a3974f411d71622eecd1b249ee37ff1c", package = "ethrex-guest-program", default-features = false, features = ["lambdavm"] }

# Exact pin: the fixture writer and the guest/executor readers must agree on the
# rkyv layout. Keep this in sync with executor/{Cargo.toml,programs/rust/ethrex/Cargo.toml}.
rkyv = { version = "=0.8.16", features = ["std", "unaligned"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The very `Crypto` impl the guest injects. On host its keccak/ECSM accelerator
# paths fall back to the same pure-Rust routines, so executing with it here
# reproduces the guest's crypto semantics without needing an RV64 toolchain.
lambda-vm-ethrex-crypto = { path = "../../crypto/ethrex-crypto" }
sha2 = "0.10"

# `ethrex-guest-program`'s `lambdavm` feature pins `lambda-vm-syscalls` to an
# older commit; override it with our working-tree copy, as the guest does.
[patch."https://github.com/yetanotherco/lambda_vm.git"]
lambda-vm-syscalls = { path = "../../syscalls" }
