[package]
name = "ethrex-block-converter"
version = "0.1.0"
edition = "2024"

# Detached workspace: keeps the heavy ethrex host deps out of the main build.
[workspace]

[dependencies]
# Pinned to the SAME ethrex rev as the guest so the generated SSZ input matches
# what the stateless guest deserializes.
ethrex-common = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-common", default-features = false, features = ["secp256k1"] }
ethrex-config = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-config", default-features = false }
# Provides `NativeCrypto`, the host `Crypto` implementation used to recover
# transaction keys, hash the BAL, and validate the generated stateless input.
# Already in the graph via `ethrex-config` -> `ethrex-p2p`, so this adds no
# compilation; the line exists because the bin build needs its own.
ethrex-crypto = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-crypto", default-features = false, features = ["secp256k1"] }
ethrex-rlp = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-rlp" }
# Matches the guest's own declaration (executor/programs/rust/ethrex/Cargo.toml).
#
# CAVEAT: this line alone does NOT reproduce the guest's precompile surface. The
# `ethrex-config` dep above pulls `ethrex-p2p`, whose `default = ["c-kzg"]`
# propagates to `ethrex-crypto/c-kzg` — and `default-features = false` cannot
# switch it off, because ethrex's own workspace declares `ethrex-p2p` with its
# defaults on. So this graph links a working c-kzg that the guest does not have;
# verify with `cargo tree -e features -i ethrex-crypto`. c-kzg is the whole gap now —
# malachite modexp and `ark-ff/asm` are on both sides since ethrex-trie's `std` default.
# Closing it means dropping `ethrex-config` and sourcing `ChainConfig` another way.
ethrex-guest-program = { git = "https://github.com/lambdaclass/ethrex.git", rev = "2cb18b0b95b27a2555d3debffdebc43c9685d6e3", package = "ethrex-guest-program", default-features = false }

# Exact pin: keep the SSZ implementation in sync with the guest's ethrex rev.
libssz = "=0.3.0"
libssz-types = "=0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Not used by this crate's code directly — declared to pin k256's feature set.
# `lambda-vm-ethrex-crypto` (a dev-dependency) is otherwise the only thing asking
# for `expose-field`, and under resolver 3 dev-dependency features are not unified
# into builds that exclude dev-dependencies. This crate is built both ways against
# one target dir: `cargo run` for `make regen-real-block-fixture`, `cargo test` for
# `make test-ethrex-real-block-converter`. Without this line the two resolve
# different k256 feature sets, so alternating between them recompiles k256 and every
# ethrex crate above it. Declaring the features here puts them in both resolutions.
# Keep in sync with crypto/ethrex-crypto's k256 line; verify:
#   cargo tree -e features,no-dev -i k256   # must list expose-field
#   cargo tree -e features -i k256          # must match the above
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "expose-field"] }

[dev-dependencies]
# The LambdaVM `Crypto` implementation used by host-side parity tests. Off
# riscv64 its keccak and ECSM paths both fall back to software.
lambda-vm-ethrex-crypto = { path = "../../crypto/ethrex-crypto" }
# No feature delta against the rest of the graph (sha2/std is already on), so this
# one can stay a dev-dependency without forcing the rebuild described above.
sha2 = "0.10"
