[package]
name = "ethrex-tests"
version = "0.1.0"
edition = "2024"

# Detached workspace: the ethrex host reference has its own dependency graph,
# separate from the main workspace. See tests/ethrex.rs.
[workspace]

[dev-dependencies]
executor = { path = "../../executor" }
# Pinned to the SAME ethrex rev as the guest so the native reference reads the
# same SSZ stateless input and output. Re-pin every manifest together with
# scripts/set_ethrex_rev.sh.
ethrex-guest-program = { git = "https://github.com/lambdaclass/ethrex.git", rev = "8effcb0671c5d0b12fe0161ea37c174ec4466b6a", package = "ethrex-guest-program" }
libssz = "=0.3.0"

# Match the root workspace's optimized dev profile: these tests execute the VM.
[profile.dev]
opt-level = 3
debug = true
