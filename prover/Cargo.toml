[package]
name = "lambda-vm-prover"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["parallel"]
parallel = ["stark/parallel", "math/parallel", "crypto/parallel", "ecsm/parallel", "dep:rayon"]
cuda = ["stark/cuda"]
test-cuda-faults = ["cuda", "stark/test-cuda-faults"]
debug-checks = ["stark/debug-checks"]
instruments = ["stark/instruments"]
# GPU profiling build (Nsight): implies cuda — the toolkit always traces the GPU prover.
nvtx = ["cuda", "instruments", "stark/nvtx"]
profile-markers = ["stark/profile-markers"]
disk-spill = ["stark/disk-spill"]
# The BLAKE3 round count, for the `LFM_HASH` arm and — since the P-a flip — for
# the commitment backends the whole prover commits under. Off = 7 rounds
# (standard BLAKE3, externally anchored); on = the 6-round A6R variant, which is
# the shipping arm and is ON BY DEFAULT via `crypto`'s default feature set.
# It is a compile-time knob rather than a parameter because the chip's column
# layout is `8 · rounds` G-blocks wide and `hash::num_columns` is a `const fn`.
#
# Naming this feature explicitly is therefore redundant on a default build. It
# stays because it is the knob `make lint`'s matrix and any `--no-default-features`
# consumer need in order to name the round count at all.
#
# It FORWARDS to `crypto`, where the primitive now lives, rather than declaring a
# second knob: the chip and the commitment backends must be at the same round
# count or a build commits under one hash and prices another. `crypto`'s is the
# only definition. The remaining way to desync them is enabling `crypto`'s alone,
# which the `SOCKET_ROUNDS == BLAKE3_ROUNDS` assertion in `lfm::blake3_socket`
# catches at compile time.
blake3-6round = ["crypto/blake3-6round"]
# Forwards `crypto`'s guest-side chained-absorb switch. See that feature's note
# for why it stays separate from `blake3-6round`: a guest emitting the absorb
# ecall needs the prover's absorb mode present to receive it.
blake3-absorb = ["crypto/blake3-absorb"]

[dependencies]
stark = { path = "../crypto/stark" }
crypto = { path = "../crypto/crypto" }
math = { path = "../crypto/math" }
executor = { path = "../executor" }
ecsm = { path = "../crypto/ecsm" }
rayon = { version = "1.8.0", optional = true }
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
log = "0.4"
digest = "0.10.7"
# pointer_width_64: 32-bit rel-ptrs cap an archive at ~2 GiB, which large
# continuation proofs exceed. Keep in sync across all proof-format crates.
rkyv = { version = "0.8.10", default-features = false, features = ["alloc", "bytecheck", "aligned", "pointer_width_64"] }

[dev-dependencies]
env_logger = "*"
criterion = { version = "0.5", default-features = false }
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
# The external anchor for `lfm::blake3` at 7 rounds and for the `LFM_HASH`
# BLAKE3 socket (`blake3::hash(a ‖ b ‖ "LFMC")`). Test-only on purpose: the
# machine never calls it, so it can never become a second implementation that
# the chip is silently checked against instead of the vectors.
blake3 = { version = "1.8.5", default-features = false, features = ["std", "pure"] }
# Enable stark's test-utils so cross-crate tests can reach
# `compute_precomputed_commitment_for_testing`. Only active under cargo test/bench.
stark = { path = "../crypto/stark", features = ["test-utils"] }
# Device-resident LDE handles for the cuda-gated GPU constraint-interp parity
# test (`tests/gpu_constraint_interp_real.rs`). Its build.rs stubs an empty cubin
# when nvcc is absent, so this compiles on CPU-only hosts too; the test itself is
# `#[cfg(feature = "cuda")]` and only runs with a GPU.
math-cuda = { path = "../crypto/math-cuda" }

[[bench]]
name = "vm_prover_benchmark"
harness = false

[[bench]]
name = "profile_vm_prover"
harness = false

[[bench]]
name = "bench_continuation"
harness = false
