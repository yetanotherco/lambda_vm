[package]
name = "lambda-vm-prover"
version = "0.1.0"
edition = "2024"

[features]
default = ["parallel"]
parallel = ["stark/parallel", "math/parallel", "crypto/parallel", "dep:rayon"]
debug-checks = ["stark/debug-checks"]
instruments = ["stark/instruments"]
# Compiles in the auto disk-spill selector. With the feature off the prover
# always uses `StorageMode::Ram` and skips the analytical peak-RAM estimate,
# which is useful for benchmarks that want to exercise the pure-Ram path.
# Forwards into stark/disk-spill, which pulls in memmap2/tempfile/libc.
disk-spill = ["stark/disk-spill"]

[dependencies]
stark = { path = "../crypto/stark" }
crypto = { path = "../crypto/crypto" }
math = { path = "../crypto/math" }
executor = { path = "../executor" }
serde = { version = "1.0", features = ["derive"] }
rayon = { version = "1.8.0", optional = true }
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
log = "0.4"

[dev-dependencies]
env_logger = "*"
criterion = { version = "0.5", default-features = false }
bincode = "1"

[[bench]]
name = "vm_prover_benchmark"
harness = false

[[bench]]
name = "profile_vm_prover"
harness = false
