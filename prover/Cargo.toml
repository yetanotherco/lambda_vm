[package]
name = "lambda-vm-prover"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["parallel"]
parallel = ["stark/parallel", "math/parallel", "crypto/parallel", "dep:rayon"]
cuda = ["stark/cuda"]
test-cuda-faults = ["cuda", "stark/test-cuda-faults"]
debug-checks = ["stark/debug-checks"]
instruments = ["stark/instruments"]
profile-markers = ["stark/profile-markers"]
disk-spill = ["stark/disk-spill"]
# Field-native hash/transcript measurement ecalls (EXPERIMENT 1). Forwards to
# `crypto`; only affects the riscv64 guest verifier. EXECUTE-ONLY (never prove).
sim-hash-ecalls = ["crypto/sim-hash-ecalls"]
# Merkle path-verify measurement stub (ROUND-2 increment A). Forwards to
# `crypto`; only affects the riscv64 guest verifier. EXECUTE-ONLY (never prove).
sim-path-ecall = ["crypto/sim-path-ecall"]
# Transcript challenge-sampling measurement stubs (ROUND-2 increment B). Forwards
# to `crypto`; only affects the riscv64 guest verifier. EXECUTE-ONLY (never prove).
sim-sample-ecall = ["crypto/sim-sample-ecall"]
# Route the recursion verifier's Fp3 mul-add through the real FEXT accelerator on
# the riscv64 guest (PR #818/#831). Forwards to `crypto`. Measurement toggle.
fext-accel = ["crypto/fext-accel"]
# Route the verifier's base×ext products through the FEXT_BASE_MUL chip. Forwards
# to `crypto`; measurement sub-toggle isolating FEXT_BASE_MUL's delta on top of
# fext-accel.
fext-base-mul = ["crypto/fext-base-mul"]
# Fp3 inverse via the FEXT_INV accelerator (completes the FEXT chip API).
# Forwards to `math`; only affects the riscv64 guest verifier's field inversion,
# where the guest's software check-multiply moves into the chip. Measurement
# toggle; takes priority over `sim-inv-hint`.
fext-inv = ["math/fext-inv"]
# Route Fp3×Fp3 multiplication through the FEXT chip (the constraint-eval / LogUp
# / zerofier ext×ext sites). Forwards to the math chain. riscv64-only effect.
fext-ext-mul = ["math/fext-ext-mul"]
# MEASUREMENT-ONLY reduced-opening stub features (EXPERIMENT 2), forwarded to the
# verifier. Never prove a build with these on. See crypto/stark features.
sim-ro-ecalls = ["stark/sim-ro-ecalls"]
sim-ro-query = ["stark/sim-ro-query"]
# ROUND-2 increment C: in-place reduced-opening ABI. Forwarded to the verifier.
# Use instead of sim-ro-ecalls. EXECUTE-ONLY (never prove).
sim-ro-inplace = ["stark/sim-ro-inplace"]
# Goldilocks inverse HINT (EXPERIMENT 5). Forwards to `math`; only affects the
# riscv64 guest verifier's field inversion. EXECUTE-ONLY (never prove).
sim-inv-hint = ["math/sim-inv-hint"]

[dependencies]
stark = { path = "../crypto/stark" }
crypto = { path = "../crypto/crypto" }
math = { path = "../crypto/math" }
executor = { path = "../executor" }
ecsm = { path = "../crypto/ecsm" }
rayon = { version = "1.8.0", optional = true }
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
log = "0.4"
digest = "0.10.7"
rkyv = { version = "0.8.10", default-features = false, features = ["alloc", "bytecheck", "aligned"] }

[dev-dependencies]
env_logger = "*"
criterion = { version = "0.5", default-features = false }
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
# Enable stark's test-utils so cross-crate tests can reach
# `compute_precomputed_commitment_for_testing`. Only active under cargo test/bench.
stark = { path = "../crypto/stark", features = ["test-utils"] }
# Device-resident LDE handles for the cuda-gated GPU constraint-interp parity
# test (`tests/gpu_constraint_interp_real.rs`). Its build.rs stubs an empty cubin
# when nvcc is absent, so this compiles on CPU-only hosts too; the test itself is
# `#[cfg(feature = "cuda")]` and only runs with a GPU.
math-cuda = { path = "../crypto/math-cuda" }

[[bench]]
name = "vm_prover_benchmark"
harness = false

[[bench]]
name = "profile_vm_prover"
harness = false

[[bench]]
name = "bench_continuation"
harness = false
