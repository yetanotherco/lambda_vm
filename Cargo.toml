[workspace]
members = [
  "executor",
  "prover",
  "crypto/stark",
  "crypto/crypto",
  "crypto/ecsm",
  "crypto/math",
  "crypto/math-cuda",
  "bin/cli",
]
# Riscv-only bare-metal crate, path-dependent from crypto/crypto (target-gated),
# ethrex-crypto, and guest programs. Without this exclude, Cargo auto-adopts it as
# an implicit member (nothing else claims it), and host workspace builds then fail:
# it defines a `#[global_allocator]` plus `#[unsafe(no_mangle)]` entrypoints/syscalls
# (and riscv `asm!`) that only assemble/link for `riscv64im-lambda-vm-elf`.
exclude = ["syscalls"]

resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"

# Optimized dev builds: tests run fast without --release.
# debug = true adds debug symbols for profiling/backtraces.
[profile.dev]
opt-level = 3
debug = true

# For profiling with samply/perf, build with:
#   CARGO_PROFILE_RELEASE_DEBUG=1 cargo build --release

# EXPERIMENT: codegen-units=1 to test a codegen-sensitive CI-only failure
# (FEXT_PAGE composition). Keeps opt-level=3 (runtime perf), only slows builds.
[profile.release]
codegen-units = 1
