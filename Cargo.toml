[workspace]
members = [
  "executor",
  "prover",
  "crypto/stark",
  "crypto/crypto",
  "crypto/math",
  "bin/cli",
]

resolver = "2"

# Optimized dev builds: tests run fast without --release.
# debug = true adds debug symbols for profiling/backtraces.
[profile.dev]
opt-level = 3
debug = true

# debug=1 = line tables only: enables function names in profilers (samply, perf)
# without slowing compilation or bloating the binary significantly.
[profile.release]
debug = 1
