[workspace]
members = [
  "executor",
  "prover",
  "crypto/stark",
  "crypto/crypto",
  "crypto/math",
  "crypto/math-cuda",
  "bin/cli",
]
# bench_vs_plonky3 lives in its own workspace (with its own Cargo.lock) so its
# heavy Plonky3 git dependencies never enter the main lock. Building the main
# workspace (e.g. `-p cli`) no longer touches Cargo.lock.
exclude = ["bench_vs_plonky3"]

resolver = "2"

# Optimized dev builds: tests run fast without --release.
# debug = true adds debug symbols for profiling/backtraces.
[profile.dev]
opt-level = 3
debug = true

# For profiling with samply/perf, build with:
#   CARGO_PROFILE_RELEASE_DEBUG=1 cargo build --release
