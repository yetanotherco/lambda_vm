[workspace]
members = [
  "executor",
  "prover",
  "crypto/stark",
  "crypto/crypto",
  "crypto/math",
  "bin/cli",
  "bench_vs_plonky3",
]

resolver = "2"

# Optimized dev builds: tests run fast without --release.
# debug = true adds debug symbols for profiling/backtraces.
[profile.dev]
opt-level = 3
debug = true

# For profiling with samply/perf, build with:
#   CARGO_PROFILE_RELEASE_DEBUG=1 cargo build --release

# Patched p3-goldilocks to disable NEON packing. Used only by bench_vs_plonky3
# for apples-to-apples scalar comparison against Lambda STARK.
[patch.crates-io]
p3-goldilocks = { path = "bench_vs_plonky3/p3-goldilocks-patched" }
