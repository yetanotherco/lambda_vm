[workspace]

[package]
name = "recursion-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
lambda-vm-prover = { path = "../../../prover", default-features = false, features = [
    "rkyv",
] }
# The guest uses a trivial in-tree bump allocator (see `src/main.rs`); no heap
# crate is needed. It never frees, so there is no critical-section consumer
# either — `embedded-alloc` + `riscv` (its critical-section provider) are gone.

# Route Keccak-f[1600] through the lambda-vm precompile syscall on the
# riscv64 guest. On host this patch is irrelevant — the host build comes
# from the main workspace which uses the upstream `keccak` crate.
[patch.crates-io]
keccak = { path = "../keccak-patched" }
