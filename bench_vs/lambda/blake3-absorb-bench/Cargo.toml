[dependencies]
lambda-vm-syscalls = { path = "../../../syscalls" }
# NOTE: crypto's own `alloc` feature is NOT enabled. It is stale on this tree —
# it turns on `use math::traits::Serializable` in merkle_tree/proof.rs, and
# `math::traits` has no `Serializable`, so `crypto` with `alloc` does not
# compile at all. Nothing in the workspace enables it either (`prover` takes
# crypto's default `["asm", "std"]`), so `["std", ...]` here is the same feature
# shape the host prover builds, minus `asm` (sha3's asm backend is x86/aarch64).
# `crypto` is `#[macro_use] extern crate alloc` unconditionally, so alloc is
# available regardless; the feature only gates that one broken import.
#
# `blake3-absorb` is NOT listed here: it arrives via this crate's `absorb_path`
# feature, which only the two absorb-capable arms require.
crypto = { path = "../../../crypto/crypto", default-features = false, features = [
    "std",
    "blake3-6round",
] }
digest = "0.10.7"

[profile.release]
debug = 2
