[workspace]

[package]
name = "blake3-absorb-bench"
version = "0.1.0"
edition = "2024"

# A guest microbenchmark for the BLAKE3 chained-absorb ecall. Exactly one arm
# feature, one length feature and one iteration-count feature select the
# binary's shape; every (arm, length, N) triple gets its own [[bin]] name so
# parallel builds never share an output path. Standalone [workspace] on purpose
# (like bench_vs/lambda/recursion) so root-level feature unification can never
# turn two arms on.

[features]
# Arms. See src/main.rs for the 2x2 (alignment x absorb-compiled-in) design.
arm_none = []
arm_keccak = []
arm_b3old = []
arm_b3oldun = []
arm_b3single = ["absorb_path"]
arm_b3absorb = ["absorb_path"]
# Compiles the guest bulk-absorb arm of `Blake3Chain::update` in. Held apart
# from the arm features so the two "old path" arms can be built with it OFF and
# the difference attributed. `crypto/blake3-absorb` implies `blake3-6round`.
absorb_path = ["crypto/blake3-absorb"]
# Message lengths
len64 = []
len256 = []
len1024 = []
len4096 = []
# Iteration counts: two builds per (arm, length), differenced.
n1000 = []
n2000 = []

[[bin]]
name = "b3bench-none-64-n1000"
path = "src/main.rs"
required-features = ["arm_none", "len64", "n1000"]

[[bin]]
name = "b3bench-none-64-n2000"
path = "src/main.rs"
required-features = ["arm_none", "len64", "n2000"]

[[bin]]
name = "b3bench-none-256-n1000"
