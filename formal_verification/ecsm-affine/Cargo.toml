[package]
name = "ecsm-affine-harness"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace: this crate lives under `formal_verification/` and must not be adopted as a
# member of the repo workspace (which lists its members explicitly).
[workspace]

[[bin]]
name = "ecsm-affine-harness"
path = "harness_dump.rs"

[dependencies]
ecsm = { path = "../../crypto/ecsm" }
num-bigint = "0.4.6"

[profile.release]
opt-level = 3
