name = "lambda_vm_proofs"
version = "0.1.0"
defaultTargets = ["Math", "Crypto", "Executor"]

[[lean_lib]]
name = "Math"

[[lean_lib]]
name = "Crypto"

# Carved single-leaf Merkle `Proof::verify` subset (Crypto/MerkleVerify.lean,
# auto-generated by proofs/scripts/carve_merkle_verify.py). Compiles standalone
# even though the full Crypto lib does not. Built as its own root so it does not
# drag in the broken Crypto.Funs.
[[lean_lib]]
name = "MerkleVerify"
globs = ["Crypto.MerkleVerify"]

# Hand-written panic-freedom (and future correctness) proofs about the carved
# MerkleVerify defs. Not auto-generated; safe to edit.
[[lean_lib]]
name = "MerkleVerifyProofs"
globs = ["Crypto.MerkleVerifyProofs"]

[[lean_lib]]
name = "Executor"

[[require]]
name = "aeneas"
git = { url = "https://github.com/AeneasVerif/aeneas", subDir = "backends/lean" }
rev = "ce1708ef1d383a887191e8e9544378991dd67668"
