[package]
name = "executor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
thiserror = "1.0.68"
rustc-demangle = "0.1"
ecsm = { path = "../crypto/ecsm" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
# Byte-identity references for the sim-hash ecall handlers (`vm::instruction::sim_hash`
# tests): `sha3` is the keccak reference the crypto sponge is itself tested against,
# `math` supplies `AsBytes::stream_bytes` (the field-element serialization oracle).
sha3 = "0.10"
math = { path = "../crypto/math", default-features = false, features = ["alloc"] }
rand = "0.9"
rand_chacha = "0.9"
