[package]
name = "executor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
thiserror = "1.0.68"
rustc-demangle = "0.1"
ecsm = { path = "../crypto/ecsm" }
# Host-side Goldilocks + degree-3 extension arithmetic for the reduced-opening
# measurement ecalls (sim-ro-ecalls / sim-ro-query). Acyclic: math does not
# depend on executor. `std` pulls in `alloc` (needed for batch inverse).
math = { path = "../crypto/math", default-features = false, features = ["std"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
