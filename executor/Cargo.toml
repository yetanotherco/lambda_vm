[package]
name = "executor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
thiserror = "1.0.68"
rustc-demangle = "0.1"
ecsm = { path = "../crypto/ecsm" }
# Host-side computation of non-constraining hints (modular inverse / sqrt) for the
# `Hint` ecall — same k256 arithmetic the guest verifies against. Required on the prove
# path, not just for benchmarks: the trace builder's `collect_hint_ops` recomputes each
# hint's output with `compute_hint` (the value is not carried in the CPU log), so
# feature-gating this away breaks proving.
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "expose-field"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
