[workspace]

# Thin LTO measurably lowers executed guest cycles (~2.3% on the committed
# ethrex_bench fixtures) at a small ELF-size cost, which is free in this VM
# (execution is priced per executed instruction, not by ELF size). Cargo's
# release default is lto = false / codegen-units = 16.
[profile.release]
lto = "thin"

[package]
name = "ethrex"
version = "0.1.0"
edition = "2024"

[dependencies]
lambda-vm-syscalls = { path = "../../../../syscalls" }
# LambdaVM crypto provider (keccak + ECSM-accelerated ecrecover), defined in the
# lambda_vm repo and injected in src/main.rs — so crypto changes stay in our repo
# and don't require an ethrex PR.
lambda-vm-ethrex-crypto = { path = "../../../../crypto/ethrex-crypto" }
# Pinned by immutable `rev` to a commit on ethrex `main`. It used to point at the
# open LambdaVM-backend PR branch (`feat/lambdavm-prover-backend`) and wait for
# that to merge; it no longer does, because the branch stopped moving 69 commits
# behind `main` while guest performance work kept landing there. Measured on the
# real benchmark block, that wait had grown to -22.9%.
#
# No `features = [...]`, deliberately — not even `lambdavm`.
#
# `ethrex-guest-program` carries one feature per zkVM and, despite the names, none
# of them selects a backend: each is only a list of optional crypto dependencies
# to activate, and none gates any method of the `Crypto` trait (its gates are
# `secp256k1`, `c-kzg`, `blst`, `std`). `lambdavm` was
# `["dep:k256", "dep:lambda-vm-syscalls", "ethrex-l2-common/secp256k1"]`, and
# since #702 moved the `Crypto` impl into this repo the syscalls it pulled are for
# ethrex's own provider, which we no longer use — while this guest already depends
# on `lambda-vm-syscalls` by path, three lines above.
#
# What makes this guest LambdaVM is those path deps plus the
# `riscv64im-lambda-vm-elf` target. None of it travels through a feature: every
# run reports its ECSM and keccak precompile calls, which is what actually proves
# the injected crypto is live.
#
# Verified rather than assumed. Against the sibling feature activating the widest
# dependency set, ethrex's own precompile stress fixtures come out identical to
# the cycle — `stress_modexp_150M` 6,373,285,966 and `stress_alt_bn128_150M`
# 22,986,061,145 both ways — and the real benchmark block is 30,498,818 here vs
# 30,501,620 there, with a 2,928-byte smaller ELF. The difference is dead
# `substrate-bn`/`bls12_381` that the arkworks-based trait defaults never call.
#
# Declaring nothing is also what frees the pin: `lambdavm` exists ONLY on that
# unmerged branch, so requiring it is precisely what tied this guest to it. See
# scripts/bench_ethrex_pr.sh, which re-pins across arbitrary revs to measure
# upstream guest PRs, and scripts/set_ethrex_rev.sh, which moves every manifest
# together.
#
# KZG is not linked, so the point-evaluation precompile (0x0a) is unsupported —
# see src/main.rs.
ethrex-guest-program = { git = "https://github.com/lambdaclass/ethrex.git", rev = "8effcb0671c5d0b12fe0161ea37c174ec4466b6a", package = "ethrex-guest-program", default-features = false }
# Defence in depth, inert today. `lambda-vm-syscalls` can reach this graph only as a git
# dep of `ethrex-guest-program`'s `lambdavm` feature, which this manifest does not enable
# — the lockfile carries no `git+https://github.com/yetanotherco/lambda_vm.git` source at
# all, so this patch currently matches nothing and cargo does not warn about it. It stays
# because the hazard it covers is real and silent: a future ethrex rev that pulls those
# syscalls from git would link a different copy than the rest of the repo, and the guest
# is the one binary where that divergence matters.
[patch."https://github.com/yetanotherco/lambda_vm.git"]
lambda-vm-syscalls = { path = "../../../../syscalls" }
