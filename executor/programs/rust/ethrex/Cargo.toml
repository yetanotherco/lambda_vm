[workspace]

# Whole-program optimisation: fat LTO over one codegen unit. On mainnet block
# 25475471 the guest executes 5.5 % fewer instructions than with thin LTO and 16
# units (one unit alone gives 4.8 %), and the ELF is smaller; the guest build
# takes about three times as long. Execution is priced per executed instruction,
# not by ELF size. Cargo's release default is lto = false / codegen-units = 16.
[profile.release]
lto = "fat"
codegen-units = 1

[package]
name = "ethrex"
version = "0.1.0"
edition = "2024"

[dependencies]
# The runtime's `memcpy`, `memmove` and `memset` are the copy accelerator's stubs
# (syscalls/src/entrypoint.rs). The `fast-memcpy` feature would keep them in software.
lambda-vm-syscalls = { path = "../../../../syscalls" }
# LambdaVM crypto provider (keccak + ECSM-accelerated ecrecover), defined in the
# lambda_vm repo and injected in src/main.rs — so crypto changes stay in our repo
# and don't require an ethrex PR.
lambda-vm-ethrex-crypto = { path = "../../../../crypto/ethrex-crypto" }
# Pinned by immutable `rev` to a commit on ethrex `main`. It used to point at the
# open LambdaVM-backend PR branch (`feat/lambdavm-prover-backend`) and wait for
# that to merge; it no longer does, because the branch stopped moving 69 commits
# behind `main` while guest performance work kept landing there. Measured on the
# real benchmark block, that wait had grown to -22.9%.
#
# No `features = [...]`, deliberately — not even `lambdavm`.
#
# `ethrex-guest-program` carries one feature per zkVM and, despite the names, none
# of them selects a backend: each is only a list of optional crypto dependencies
# to activate, and none gates any method of the `Crypto` trait (its gates are
# `secp256k1`, `c-kzg`, `blst`, `std`). `lambdavm` was
# `["dep:k256", "dep:lambda-vm-syscalls", "ethrex-l2-common/secp256k1"]`, and
# since #702 moved the `Crypto` impl into this repo the syscalls it pulled are for
# ethrex's own provider, which we no longer use — while this guest already depends
# on `lambda-vm-syscalls` by path, above.
#
# What makes this guest LambdaVM is those path deps plus the
# `riscv64im-lambda-vm-elf` target, and `lambdavm` existed ONLY on the unmerged
# branch, so requiring it is what tied this guest to it. Re-pin with
# scripts/set_ethrex_rev.sh.
#
# Measured, not assumed: against the sibling feature activating the widest dependency
# set, `stress_modexp_150M` (6,373,285,966) and `stress_alt_bn128_150M`
# (22,986,061,145) are identical to the cycle, and the real benchmark block is
# 30,498,818 here vs 30,501,620 there, with a 2,928-byte smaller ELF. What the drop
# actually removes is C libsecp256k1 (`secp256k1`, `secp256k1-sys`, `bitcoin_hashes`,
# `bitcoin-io`, `hex-conservative` leave the lock); we inject our own ecrecover.
#
# 0x0a and 0x0b-0x11 are unsupported — see src/main.rs.
ethrex-guest-program = { git = "https://github.com/lambdaclass/ethrex.git", rev = "797df5540c7d35cafd69b6971a74b2a49c67d1dd", package = "ethrex-guest-program", default-features = false }
# Exact pin: must match the fixture writer (tooling/ethrex-fixtures) and the
# executor test reader so the rkyv ProgramInput layout stays consistent.
rkyv = { version = "=0.8.16", features = ["std", "unaligned"] }

# Valid jump destinations as a bitmap, and ethrex main's unchecked memory hot
# path. Every ethrex crate of this guest is built from yetanotherco/ethrex, branch
# lambda-vm/jumpmap-plus: the pinned rev above plus three commits. The first keeps
# the JUMPDEST analysis as a bitmap, so a JUMP / JUMPI checks one bit instead of
# binary-searching the offset list; the second takes the tracer's branch of the
# jump out of line; the third is ethrex main's #7119 (MLOAD / MSTORE and the
# memory accessors without the checks their callers already made). A jump is
# valid exactly when it was before (the commits carry the tests that compare the
# two checks), and ProgramInput is untouched, so the fixture writer and the native
# test reference stay on the pin. On mainnet block 25475471 the guest executes
# 10.8 M fewer instructions (-5.1 %). Ethrex main has carried an equivalent bitmap
# since 3ca8bc23 (#7095) and #7119 since 007882a8; drop this patch when the pin
# moves past them.
#
# All eight crates are patched together: patching only the two that changed would
# leave two copies of ethrex-crypto in the graph. scripts/set_ethrex_rev.sh checks
# that the fork's base below is the pinned rev and refuses to move the pin past it.
# ethrex-fork-base: 797df5540c7d35cafd69b6971a74b2a49c67d1dd
[patch."https://github.com/lambdaclass/ethrex.git"]
ethrex-common = { git = "https://github.com/yetanotherco/ethrex.git", rev = "4a6d927017d6b39c6ad086089d975d193d4ac399" }
ethrex-crypto = { git = "https://github.com/yetanotherco/ethrex.git", rev = "4a6d927017d6b39c6ad086089d975d193d4ac399" }
ethrex-guest-program = { git = "https://github.com/yetanotherco/ethrex.git", rev = "4a6d927017d6b39c6ad086089d975d193d4ac399" }
ethrex-l2-common = { git = "https://github.com/yetanotherco/ethrex.git", rev = "4a6d927017d6b39c6ad086089d975d193d4ac399" }
ethrex-levm = { git = "https://github.com/yetanotherco/ethrex.git", rev = "4a6d927017d6b39c6ad086089d975d193d4ac399" }
ethrex-rlp = { git = "https://github.com/yetanotherco/ethrex.git", rev = "4a6d927017d6b39c6ad086089d975d193d4ac399" }
ethrex-trie = { git = "https://github.com/yetanotherco/ethrex.git", rev = "4a6d927017d6b39c6ad086089d975d193d4ac399" }
ethrex-vm = { git = "https://github.com/yetanotherco/ethrex.git", rev = "4a6d927017d6b39c6ad086089d975d193d4ac399" }
