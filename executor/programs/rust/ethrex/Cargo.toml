[workspace]

[package]
name = "ethrex"
version = "0.1.0"
edition = "2024"

[dependencies]
lambda-vm-syscalls = { path = "../../../../syscalls" }
# LambdaVM crypto provider (keccak + ECSM-accelerated ecrecover), defined in the
# lambda_vm repo and injected in src/main.rs — so crypto changes stay in our repo
# and don't require an ethrex PR.
lambda-vm-ethrex-crypto = { path = "../../../../crypto/ethrex-crypto" }
# Pinned by immutable `rev` to a commit on the open LambdaVM-backend PR branch
# (feat/lambdavm-prover-backend) of ethrex; re-pin to the merge commit once it
# lands on ethrex `main`. The `lambdavm` feature is kept only for its dependency
# wiring (`ProgramInput`/`execution_program`/`ProgramOutput::encode` + pure-Rust
# crypto defaults); ethrex's own `LambdaVmCrypto` compiles unused — we inject our
# own. KZG is NOT linked under this feature, so the point-evaluation precompile
# (0x0a) is unsupported — see src/main.rs.
ethrex-guest-program = { git = "https://github.com/lambdaclass/ethrex.git", rev = "156cb8d6a3974f411d71622eecd1b249ee37ff1c", package = "ethrex-guest-program", default-features = false, features = ["lambdavm"] }
# Exact pin: must match the fixture writer (tooling/ethrex-fixtures) and the
# executor test reader so the rkyv ProgramInput layout stays consistent.
rkyv = { version = "=0.8.16", features = ["std", "unaligned"] }

# `ethrex-guest-program`'s `lambdavm` feature pins `lambda-vm-syscalls` to an
# older commit. Override it with our working-tree copy so the guest links our
# current syscalls (keccak_permute + the Print-ecall no-op fix).
[patch."https://github.com/yetanotherco/lambda_vm.git"]
lambda-vm-syscalls = { path = "../../../../syscalls" }

# BENCH: route every Keccak permutation (Ethereum trie/RLP hashing via ethrex-crypto's
# `keccak_hash` + `ethbloom`) through the `keccak_permute` accelerator syscall by
# swapping in our vendored tiny-keccak fork (only `keccakf` changes; host builds
# fall back to the software permutation).
[patch.crates-io]
tiny-keccak = { path = "../../../../crypto/tiny-keccak" }
