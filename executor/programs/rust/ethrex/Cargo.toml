[workspace]

# Thin LTO measurably lowers executed guest cycles (~2.3% on the committed
# ethrex_bench fixtures) at a small ELF-size cost, which is free in this VM
# (execution is priced per executed instruction, not by ELF size). Cargo's
# release default is lto = false / codegen-units = 16.
[profile.release]
lto = "thin"

[package]
name = "ethrex"
version = "0.1.0"
edition = "2024"

[features]
# ON BY DEFAULT, deliberately. `/bench` builds the workload with a plain
# `make executor/program_artifacts/rust/ethrex.elf` and proves that one ELF, so
# the accelerator has to be in the default build or the bench cannot see it.
# `--no-default-features` still yields the plain software sponge — that is how
# `ethrex-nosponge.elf` is built for a local correctness A/B.
default = ["keccak-sponge-accel"]

# Hash whole 136-byte keccak rate blocks on the KECCAK_SPONGE absorb
# accelerator (ECALL -4) rather than in guest software; the `10*1`-padded tail
# still goes through `keccak_permute`. The digests, and therefore the proven
# block, are identical either way.
#
# What this actually reaches: ethrex's trie node hashes, contract-code hashes,
# block/receipt hashes and the KECCAK256 opcode, all of which route through
# `Crypto::keccak256` -> `lambda-vm-ethrex-crypto`. It does NOT reach the
# `ethrex_crypto::keccak::keccak_hash` free function (software tiny-keccak),
# which on this ethrex rev is cold anyway — see ethrex-wiring.md §2.
#
# ⚠ An ELF built with this on runs `ECALL -4`, which only exists on an executor
# that has the KECCAK_SPONGE chip. It will NOT execute on `origin/main` until
# PR #912 lands — see the /bench fallback hazard in ethrex-wiring.md §10.
keccak-sponge-accel = [
  "lambda-vm-ethrex-crypto/keccak-sponge-accel",
  "lambda-vm-syscalls/keccak-sponge-accel",
]

[dependencies]
lambda-vm-syscalls = { path = "../../../../syscalls" }
# LambdaVM crypto provider (keccak + ECSM-accelerated ecrecover), defined in the
# lambda_vm repo and injected in src/main.rs — so crypto changes stay in our repo
# and don't require an ethrex PR.
lambda-vm-ethrex-crypto = { path = "../../../../crypto/ethrex-crypto" }
# Pinned by immutable `rev` to a commit on the open LambdaVM-backend PR branch
# (feat/lambdavm-prover-backend) of ethrex; re-pin to the merge commit once it
# lands on ethrex `main`. The `lambdavm` feature is kept only for its dependency
# wiring (`ProgramInput`/`execution_program`/`ProgramOutput::encode` + pure-Rust
# crypto defaults); ethrex's own `LambdaVmCrypto` compiles unused — we inject our
# own. KZG is NOT linked under this feature, so the point-evaluation precompile
# (0x0a) is unsupported — see src/main.rs.
ethrex-guest-program = { git = "https://github.com/lambdaclass/ethrex.git", rev = "156cb8d6a3974f411d71622eecd1b249ee37ff1c", package = "ethrex-guest-program", default-features = false, features = ["lambdavm"] }
# Exact pin: must match the fixture writer (tooling/ethrex-fixtures) and the
# executor test reader so the rkyv ProgramInput layout stays consistent.
rkyv = { version = "=0.8.16", features = ["std", "unaligned"] }

# `ethrex-guest-program`'s `lambdavm` feature pins `lambda-vm-syscalls` to an
# older commit. Override it with our working-tree copy so the guest links our
# current syscalls (keccak_permute + the Print-ecall no-op fix).
[patch."https://github.com/yetanotherco/lambda_vm.git"]
lambda-vm-syscalls = { path = "../../../../syscalls" }
