[package]
name = "lambda-vm-syscalls"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-alloc = "0.6"
riscv = { version = "0.15", features = ["critical-section-single-hart"] }
thiserror = "1.0"
getrandom = { version = "0.3.4", default-features = false }
getrandom_v2 = {version = "0.2.15", features = ["custom"], package = "getrandom"}
lazy_static = "1.5.0"
rand = "0.9.2"
# `dlmalloc` feature only (optional so the default TLSF build never pulls them).
# `critical-section` gives the Sync a #[global_allocator] static needs; its single-hart
# impl already comes from `riscv` above (same as embedded-alloc's TLSF heap uses).
dlmalloc = { version = "0.2.14", default-features = false, optional = true }
critical-section = { version = "1.2", optional = true }

[features]
# BENCH: swap the guest global allocator from embedded-alloc TLSF to Doug Lea's malloc
# (dlmalloc), backed by a bump "system" provider over the guest heap. Unlike a raw bump
# allocator it reclaims freed memory (no OOM on churny workloads) while measuring cheaper
# than the default TLSF on zkVM guests (Bencik's ZisK comparison). Off by default; see
# `src/allocator.rs`.
dlmalloc = ["dep:dlmalloc", "dep:critical-section"]

[dev-dependencies]
keccak = "0.1"
# Stable stream across versions (unlike StdRng), so fuzz-case seeds stay reproducible.
rand_chacha = "0.9"
sha3 = "0.10"
