[package]
name = "lambda-vm-syscalls"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Route whole 136-byte keccak rate blocks through the KECCAK_SPONGE absorb
# accelerator (ECALL -4) instead of XOR-ing them into the state in guest
# software. Off by default: both variants stay buildable so the prover A/B is
# honest, and the digests are identical either way.
keccak-sponge-accel = []

[dependencies]
embedded-alloc = "0.6"
riscv = { version = "0.15", features = ["critical-section-single-hart"] }
thiserror = "1.0"
getrandom = { version = "0.3.4", default-features = false }
getrandom_v2 = {version = "0.2.15", features = ["custom"], package = "getrandom"}
lazy_static = "1.5.0"
rand = "0.9.2"

[dev-dependencies]
keccak = "0.1"
# Stable stream across versions (unlike StdRng), so fuzz-case seeds stay reproducible.
rand_chacha = "0.9"
sha3 = "0.10"
