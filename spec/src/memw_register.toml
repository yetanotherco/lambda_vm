name = "MEMW_R"
code = "MWR"

# Variables

[[variables.input]]
name = "address"
type = "Byte"
desc = "address of the register being accessed"
pad = 0

[[variables.input]]
name = "timestamp"
type = "DWordWL"
desc = "timestamp at which the access takes place"
pad = 0

[[variables.input]]
name = "val"
type = "DWordWL"
desc = "value being written to this register"
pad = 0

[[variables.output]]
name = "old"
type = "DWordWL"
desc = "value of this register at `old_timestamp`."
pad = 0

[[variables.auxiliary]]
name = "old_timestamp_lo"
type = "Word"
desc = "the lower limb of `old_timestamp`"
pad = 0

[[variables.virtual]]
name = "old_timestamp"
type = "DWordWL"
desc = "timestamp at which this register was last accessed"
def = ["cast", ["arr", "old_timestamp_lo", ["idx", "timestamp", 1]], "DWordWL"]

[[variables.virtual]]
name = "μ_sum"
type = "Bit"
desc = ""
def = ["+", "μ_read", "μ_write"]

[[variables.multiplicity]]
name = "μ_read"
type = "Bit"
desc = "Whether we are performing a read (and hence return `out`)"
pad = 0

[[variables.multiplicity]]
name = "μ_write"
type = "Bit"
desc = "Whether we are performing a write (and hence not return `out`)"
pad = 0



# Assumptions

[[assumptions]]
desc = "`IS_WORD[val[i]]`"
iter = ["i", 0, 1]
ref = "regw:a:val"

[[assumptions]]
desc = "`IS_WORD[timestamp[i]]`"
iter = ["i", 0, 1]
ref = "regw:a:timestamp"

# Constraints

[[constraint_groups]]
name = "diff"

[[constraints.diff]]
kind = "interaction"
tag = "IS_HALF"
input = [["-", ["idx", "timestamp", 0], ["idx", "old_timestamp", 0], 1]]
multiplicity = "μ_sum"
ref = "regw:c:diff"


[[constraint_groups]]
name = "multiplicities"

[[constraints.multiplicities]]
kind = "template"
tag = "IS_BIT"
input = ["μ_read"]
ref = "regw:c:μ_read_is_bit"

[[constraints.multiplicities]]
kind = "template"
tag = "IS_BIT"
input = ["μ_write"]
ref = "regw:c:μ_write_is_bit"

[[constraints.multiplicities]]
kind = "template"
tag = "IS_BIT"
input = ["μ_sum"]
ref = "regw:c:μ_sum_is_bit"

[[constraint_groups]]
name = "interactions"

[[constraints.interactions]]
kind = "interaction"
tag = "memory"
input = [1, ["arr", ["cast", ["+", ["*", 2, "address"], "i"], "Word"], 0], "old_timestamp", ["idx", "old", "i"]]
iter = ["i", 0, 1]
multiplicity = "μ_sum"
ref = "regw:c:read_old"

[[constraints.interactions]]
kind = "interaction"
tag = "memory"
input = [1, ["arr", ["cast", ["+", ["*", 2, "address"], "i"], "Word"], 0], "timestamp", ["idx", "val", "i"]]
iter = ["i", 0, 1]
multiplicity = ["-", "μ_sum"]
ref = "regw:c:write_val"


[[constraint_groups]]
name = "output"

[[constraints.output]]
kind = "interaction"
tag = "MEMW"
input = [1, ["arr", ["cast", ["*", 2, "address"], "Word"], 0], ["arr", ["idx", "val", 0], ["idx", "val", 1], 0, 0, 0, 0, 0, 0], "timestamp", 1, 0, 0]
output = ["arr", ["idx", "old", 0], ["idx", "old", 1], 0, 0, 0, 0, 0, 0]
multiplicity = ["-", "μ_read"]

[[constraints.output]]
kind = "interaction"
tag = "MEMW"
input = [1, ["arr", ["cast", ["*", 2, "address"], "Word"], 0], ["arr", ["idx", "val", 0], ["idx", "val", 1], 0, 0, 0, 0, 0, 0], "timestamp", 1, 0, 0]
multiplicity = ["-", "μ_write"]
