name = "SHIFT"

# Input

[[variables.input]]
name = "in"
type = "DWordHL"
desc = "The word being shifted"

[[variables.input]]
name = "shift"
type = "BaseField"
desc = "Number of bits to shift `in` by."

[[variables.input]]
name = "direction"
type = "Bit"
desc = "Whether to shift left (0) or right (1)."

[[variables.input]]
name = "signed"
type = "Bit"
desc = "Whether to interpret `in` as a signed integer."


# Output

[[variables.output]]
name = "shifted"
type = "DWordHL"
desc = "`in <</>> (shift % 64)`"


# Auxiliary
[[variables.auxiliary]]
name = "bit_shift"
type = "Byte"
desc = "`shift && 0x0F`"

[[variables.auxiliary]]
name = "limb_shift"
type = ["Bit", 4]
desc = "One-hot vector indicating whether $floor.l #`shift` / 16 floor.r equiv i mod 4$."

[[variables.auxiliary]]
name = "bit_shifted_uncarried"
type = ["Half", 4]
desc = "result of left/right shifting the individual limbs of `in` by `bit_shift`, i.e., without the carry values."

[[variables.auxiliary]]
name = "carry"
type = ["Half", 4]
desc = "the carry values of left/right shifting `in` by `bit_shift`."

[[variables.auxiliary]]
name = "is_negative"
type = "Bit"
desc = "whether `in` is negative."

# Virtual

[[variables.virtual]]
name = "extension"
type = "Half"
desc = "sign extension of `in`."
poly = ["*", 65535, "is_negative"]

[[variables.virtual]]
name = "left"
type = "Bit"
desc = "Whether to perform a left-shift."
poly = ["-", "μ", "direction"]

[[variables.virtual]]
name = "right"
type = "Bit"
desc = "Whether to perform a right-shift."
poly = "direction"

[[variables.virtual]]
name = "bit_shifted"
type = "DWordHL"
desc = "`in <</>> (shift % 16)`"
poly = ["+", ["idx", "bit_shifted_uncarried", "i"],  ["idx", "carry", "i"]]

# Multiplicities

[[variables.multiplicity]]
name = "μ"
type = "Bit"
desc = ""



# Assumptions

[[assumptions]]
desc = "`IS_HALFWORD[in[i]]`"
range = ["i", 0, 3]
ref = "shift:a:range_in"



# Constraints

[[constraint_groups]]
name = "defs"

[[constraints.defs]]
kind = "interaction"
tag = "AND_BYTE"
input = ["shift", "0x0F"]
output = "bit_shift"
ref = "shift:c:bit_shift"
multiplicity = "μ"

[[constraints.defs]]
kind = "interaction"
tag = "AND_BYTE"
input = ["shift", "0x30"]
output = ["+", ["-", 1, ["idx", "limb_shift", 0]], ["*", 15, ["idx", "limb_shift", 1]], ["*", 31, ["idx", "limb_shift", 2]], ["*", 47, ["idx", "limb_shift", 3]]]
ref = "shift:c:limb_shift_lookup"
multiplicity = "μ"

[[constraints.defs]]
kind = "template"
tag = "IS_BIT"
input = [["idx", "limb_shift", "i"]]
range = ["i", 0, 4]
ref = "shift:c:limb_shift_is_bit"

[[constraint_groups]]
name = "intra_limb_left_shifting"

[[constraints.intra_limb_left_shifting]]
kind = "interaction"
tag = "HWSL"
input = [["idx", "in", "i"], "bit_shift"]
output = ["idx", "bit_shifted_uncarried", "i"]
range = ["i", 0, 3]
multiplicity = "left"
ref = "shift:c:hwsl"

[[constraints.intra_limb_left_shifting]]
kind = "interaction"
tag = "HWSLC"
input = [["idx", "in", ["-", "i", 1]], "bit_shift"]
output = ["idx", "carry", "i"]
range = ["i", 1, 3]
multiplicity = "left"
ref = "shift:c:hwsl"

[[constraints.intra_limb_left_shifting]]
kind = "arith"
constraint = "$#`direction` => #`μ`$"
poly = ["*", "direction", ["-", 1, "μ"]]
ref = "shift:c:direction_implies_mu"

[[constraints.intra_limb_left_shifting]]
kind = "arith"
constraint = "$#`left` => #`carry[0]` = 0$"
poly = ["*", "left", ["idx", "carry", 0]]
ref = "shift:c:left_zero_carry"


[[constraint_groups]]
name = "intra_limb_right_shifting"

[[constraints.intra_limb_right_shifting]]
kind = "interaction"
tag = "HWSR"
input = [["idx", "in", "i"], "bit_shift"]
output = ["idx", "bit_shifted_uncarried", "i"]
range = ["i", 0, 3]
multiplicity = "right"
ref = "shift:c:hwsr"

[[constraints.intra_limb_right_shifting]]
kind = "interaction"
tag = "HWSRC"
input = [["idx", "in", ["+", "i", 1]], "bit_shift"]
output = ["idx", "carry", "i"]
range = ["i", 0, 2]
multiplicity = "right"
ref = "shift:c:hwsrc"

[[constraints.intra_limb_right_shifting]]
kind = "interaction"
tag = "MSB16"
input = [["idx", "in", 3]]
output = "is_negative"
multiplicity = "signed"
ref = "shift:c:is_negative"

[[constraints.intra_limb_right_shifting]]
kind = "arith"
constraint = "$#`!signed` => #`is_negative` = 0$"
poly = ["*", ["-", 1, "signed"], "is_negative"]

[[constraints.intra_limb_right_shifting]]
kind = "interaction"
tag = "HWSRC"
input = ["extension", "bit_shift"]
output = ["idx", "carry", 3]
multiplicity = "right"
ref = "shift:c:right_sign_extend"


[[constraint_groups]]
name = "limb_shifting"

[[constraints.limb_shifting]]
kind = "arith"
constraint = "$#`shifted[i]` = #`left` dot sum_(j=0)^i #`limb_shift[j]` dot #`bit_shifted[i-j]` + #`right` dot (sum_(j=0)^(3-i) #`limb_shift[j]` dot #`bit_shifted[i+j]` + sum_(j=3-i)^3 #`limb_shift[j]` dot #`extension`)$"
poly = ["-", ["idx", "shifted", "i"], ["+", ["*", "left", ["sum", ["=", "j", 0], "i", ["*", ["idx", "limb_shift", "j"], ["idx", "bit_shifted", ["-", "i", "j"]]]]], ["*", "right", ["+", ["sum", ["=", "j", 0], ["-", 3, "i"], ["*", ["idx", "limb_shift", "j"], ["idx", "bit_shifted", ["+", "i", "j"]]]], ["sum", ["=", "j", ["-", 3, "i"]], 3, ["*", "extension", ["idx", "limb_shift", "j"]]]]]]]
range = ["i", 0, 3]


# Lookups

[[constraint_groups]]
name = "lookups"

[[constraints.lookups]]
kind = "interaction"
tag = "SHIFT"
input = ["in", "shift", "direction", "signed"]
output = "shifted"
multiplicity = "-μ"
ref = "shift:c:lookup"
