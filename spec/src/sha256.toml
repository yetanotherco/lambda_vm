[[constraints.sched]]
kind = "interaction"
tag = "SHA256_M"
input = ["timestamp", "i"]
output = ["+",
  ["*", ["^", 2, 0], ["idx", "m", ["+", ["*", 4, "i"], 3]]],
  ["*", ["^", 2, 8], ["idx", "m", ["+", ["*", 4, "i"], 2]]],
  ["*", ["^", 2, 16], ["idx", "m", ["+", ["*", 4, "i"], 1]]],
