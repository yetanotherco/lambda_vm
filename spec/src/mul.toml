name = "MUL"


# Input

[[variables.input]]
name = "lhs"
type = "DWordHL"
desc = "the left hand operator."

[[variables.input]]
name = "lhs_signed"
type = "Bit"
desc = "whether to interpret `lhs` as a signed integer (1) or not (0)."

[[variables.input]]
name = "rhs"
type = "DWordHL"
desc = "the right hand operator."

[[variables.input]]
name = "rhs_signed"
type = "Bit"
desc = "whether to interpret `rhs` as a signed integer (1) or not (0)."


# Output

[[variables.output]]
name = "res"
type = "QuadWL"
desc = "the (extended) multiplication result"

# Auxiliary

[[variables.auxiliary]]
name = "lhs_is_negative"
type = "Bit"
desc = "whether `lhs` is negative (1) or not (0)"

[[variables.auxiliary]]
name = "rhs_is_negative"
type = "Bit"
desc = "whether `rhs` is negative (1) or not (0)"

[[variables.auxiliary]]
name = "raw_product"
type = ["B51", 4]
desc = "raw multiplication output"

# Virtual

[[variables.virtual]]
name = "lhs_ext"
type = ["Half", 8]
desc = "sign-extended value of `lhs`"
def = {idx="i", polys=[
    {range=[0, 3], poly=["idx", "lhs", "i"]},
    {range=[4, 7], poly=["*", 0xFFFF, "lhs_is_negative"]},
]}

[[variables.virtual]]
name = "rhs_ext"
type = ["Half", 8]
desc = "sign-extended value of `rhs`"
def = {idx="i", polys=[
    {range=[0, 3], poly=["idx", "rhs", "i"]},
    {range=[4, 7], poly=["*", 0xFFFF, "rhs_is_negative"]},
]}

[[variables.virtual]]
name = "limb_product"
type = ["B35", 8]
desc = "raw multiplication output"
def = {idx="i", range=[0, 7], poly=["sum", ["=", "j", 0], "i", ["*", ["idx", "lhs_ext", "i"], ["idx", "rhs_ext", ["-", "i", "j"]]]]}

[[variables.virtual]]
name = "carry"
type = ["B19", 4]
desc = "carry values"
def = {idx="i", polys=[
    {range=0, poly=["*", ["^", 2, -32], ["-", ["idx", "raw_product", 0], ["idx", "res", 0]]]},
    {range=[1, 3], poly=["*", ["^", 2, -32], ["-", ["+", ["idx", "raw_product", "i"], ["idx", "carry", ["-", "i", 1]]], ["idx", "res", "i"]]]},
]}

[[variables.virtual]]
name = "μ_sum"
type = "Bit"
desc = "sum of multiplicies"
def = ["+", "μ_lo", "μ_hi"]

# Multiplicity

[[variables.multiplicity]]
name = "μ_lo"
type = "BaseField"
desc = ""

[[variables.multiplicity]]
name = "μ_hi"
type = "BaseField"
desc = ""

# Assumptions

[[assumptions]]
desc = "`IS_HALF[lhs[i]]`"
range = ["i", 0, 3]

[[assumptions]]
desc = "`IS_HALF[rhs[i]]`"
range = ["i", 0, 3]

[[assumptions]]
desc = "`IS_WORD[res[i]]`"
range = ["i", 0, 3]


# Constraints

[[constraint_groups]]
name = "def"

[[constraints.def]]
kind = "template"
tag = "SIGN"
input = [["idx", "lhs", 3], "lhs_signed"]
output = "lhs_is_negative"
ref = "mul:c:lhs_is_negative"

[[constraints.def]]
kind = "template"
tag = "SIGN"
input = [["idx", "rhs", 3], "rhs_signed"]
output = "rhs_is_negative"
ref = "mul:c:rhs_is_negative"

[[constraints.def]]
kind = "interaction"
tag = "IS_B19"
input = [["idx", "carry", "i"]]
range = ["i", 0, 3]
multiplicity = "μ_sum"
ref = "mul:c:carry"

[[constraint_groups]]
name = "prod"


[[constraints.prod]]
kind = "arith"
constraint = "$#`raw_product[i]` = #`limb_product[2i]` + 2^16 dot #`limb_product[2i + 1]`$"
poly = ["-", ["+", ["idx", "limb_product", ["*", 2, "i"]], ["*", ["^", 2, 16], ["idx", "limb_product", ["+", ["*", 2, "i"], 1]]]], ["idx", "raw_product", "i"]]
range = ["i", 0, 3]

[[constraint_groups]]
name = "lookup"

[[constraints.lookup]]
kind = "interaction"
tag = "MUL"
input = ["lhs", "lhs_signed", "rhs", "rhs_signed", "0"]
output = ["idx", "res", "0:4"]
multiplicity = ["-", "μ_lo"]
ref = "mul:c:lookup_lo"

[[constraints.lookup]]
kind = "interaction"
tag = "MUL"
input = ["lhs", "lhs_signed", "rhs", "rhs_signed", "1"]
output = ["idx", "res", "4:8"]
multiplicity = ["-", "μ_hi"]
ref = "mul:c:lookup_hi"