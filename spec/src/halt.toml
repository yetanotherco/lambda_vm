name = "HALT"

[[variables.input]]
name = "timestamp"
type = "Word"
desc = "timestamp at which to halt the program"

[[variables.auxiliary]]
name = "pc"
type = "DWordWL"
desc = "The `next_pc` value the CPU wrote during the instruction HALT was invoked"

[[assumptions]]
desc = "`IS_WORD[timestamp]`"


[[constraint_groups]]
name = "all"

[[constraints.all]]
kind = "template"
tag = "REGW"
input = ["i", ["cast", 0, "DWordWL"], ["-", ["^", 2, 32], 1]]
iter = ["i", 1, 9]
ref = "halt:c:zeroize_registers_lo"

[[constraints.all]]
kind = "template"
tag = "REG"
input = [10, ["cast", 0, "DWordWL"], ["-", ["^", 2, 32], 1]]
output = ["cast", 0, "DWordWL"]
ref = "halt:c:read_zero_exit_code"

[[constraints.all]]
kind = "template"
tag = "REGW"
input = ["i", ["cast", 0, "DWordWL"], ["-", ["^", 2, 32], 1]]
iter = ["i", 11, 31]
ref = "halt:c:zeroize_registers_hi"

[[constraints.all]]
kind = "interaction"
tag = "memory"
input = [1, ["arr", ["+", ["*", 2, 255], "i"], 0], ["+", "timestamp", 1], ["idx", "pc", "i"]]
multiplicity = 1
iter = ["i", 0, 1]
ref = "halt:c:consume_pc"

[[constraints.all]]
kind = "interaction"
tag = "memory"
input = [1, ["arr", ["+", ["*", 2, 255], "i"], 0], ["+", "timestamp", 1], ["-", 1, "i"]]
multiplicity = -1
iter = ["i", 0, 1]
ref = "halt:c:emit_pc"

[[constraint_groups]]
name = "lookup"

[[constraints.lookup]]
kind = "interaction"
tag = "ECALL"
input = ["timestamp", ["cast", 93, "DWordWL"]]
multiplicity = ["-", 1]
ref = "halt:c:lookup"
