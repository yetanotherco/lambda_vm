name = "MEMMOVE"
code = "MMV"

# Input

[[variables.input]]
name = "timestamp"
type = "Word"
desc = "timestamp at which the operation is requested"
pad = 0

# Auxiliary

[[variables.auxiliary]]
name = "src"
type = "DWordWL"
desc = "Address of the first byte read by this row"
pad = 0

[[variables.auxiliary]]
name = "src_incr"
type = "DWordHL"
desc = "$#`src` + #`step`$"
pad = 1

[[variables.auxiliary]]
name = "dst"
type = "DWordWL"
desc = "Address of the first byte written by this row. For `commit`, the index of that byte in the committed output"
pad = 0

[[variables.auxiliary]]
name = "dst_incr"
type = "DWordHL"
desc = "$#`dst` + #`step`$"
pad = 1

[[variables.auxiliary]]
name = "count"
type = "DWordWL"
desc = "Number of bytes that still have to be moved, including those moved by this row"
pad = 1

[[variables.auxiliary]]
name = "count_decr"
type = "DWordHL"
desc = "$#`count` - #`step`$"
pad = ["arr", 0, 0, 0, 0]

[[variables.auxiliary]]
name = "first"
type = "Bit"
desc = "Whether this is the first row of this sequence"
pad = 0

[[variables.auxiliary]]
name = "end"
type = "Bit"
desc = "Whether this is the end of the sequence"
pad = 0

[[variables.auxiliary]]
name = "tail"
type = "Bit"
desc = "Whether this row moves a single byte rather than eight"
pad = 1

[[variables.auxiliary]]
name = "count_lt8"
type = "Bit"
desc = "Whether $#`count` < 8$, i.e. whether this row may not move eight bytes"
pad = 1

[[variables.auxiliary]]
name = "is_set"
type = "Bit"
desc = "Whether this row runs the `memset` functionality, which inverts the order of the read and the write"
pad = 0

[[variables.auxiliary]]
name = "is_commit"
type = "Bit"
desc = "Whether this row runs the `commit` functionality, which writes to the commitment domain rather than to RAM"
pad = 0

[[variables.auxiliary]]
name = "first_ecall"
type = "Bit"
desc = "$#`first` dot (1 - #`is_commit`)$; whether this row is the first of a sequence entered through an `ECALL`"
pad = 0

[[variables.auxiliary]]
name = "commit_write"
type = "Bit"
desc = "$(#`μ` - #`end`) dot #`is_commit`$; whether this row writes to the commitment domain"
pad = 0

[[variables.auxiliary]]
name = "commit_write_wide"
type = "Bit"
desc = "$#`commit_write` dot (1 - #`tail`)$; whether this row writes eight bytes to the commitment domain"
pad = 0

[[variables.auxiliary]]
name = "value"
type = "DWordBL"
desc = "The bytes moved by this row; only $#`value`_0$ is moved when $#`tail` = 1$. Unconstrained on rows that move nothing"
pad = 0

# Virtual

[[variables.virtual]]
name = "step"
type = "Byte"
desc = "The stride this row advances by: eight, or one when `tail` is set"
def = ["-", 8, ["*", 7, "tail"]]

[[variables.virtual]]
name = "first_commit"
type = "Bit"
desc = "$#`first` dot #`is_commit`$; whether this row is the first of a sequence deferred by `COMMIT`"
def = ["-", "first", "first_ecall"]

[[variables.virtual]]
name = "ram_write"
type = "Bit"
desc = "$(#`μ` - #`end`) dot (1 - #`is_commit`)$; whether this row writes to RAM"
def = ["-", "μ", "end", "commit_write"]

[[variables.virtual]]
name = "commit_lane"
type = ["Bit", 8]
desc = "Whether lane $i$ reaches the commitment domain: lane $0$ on every committing row, lanes $1$ through $7$ only on a wide one"
def = {idx = "i", polys = [
    {iter = 0, poly = "commit_write"},
    {iter = [1, 7], poly = "commit_write_wide"},
]}

# Multiplicity

[[variables.multiplicity]]
name = "μ"
type = "Bit"
desc = ""
pad = 0

# Assumptions

[[assumptions]]
desc = "`IS_WORD[timestamp]`"
ref = "memmove:a:timestamp"

[[assumptions]]
desc = "`IS_WORD[src[i]]`"
iter = ["i", 0, 1]
ref = "memmove:a:src"

[[assumptions]]
desc = "`IS_WORD[dst[i]]`"
iter = ["i", 0, 1]
ref = "memmove:a:dst"

[[assumptions]]
desc = "`IS_WORD[count[i]]`"
iter = ["i", 0, 1]
ref = "memmove:a:count"

# Constraints

[[constraint_groups]]
name = "incoming"

[[constraints.incoming]]
kind = "interaction"
tag = "ECALL"
input = ["timestamp", ["arr", ["-", ["^", 2, 32], 30, ["*", 2, "is_set"]], ["-", ["^", 2, 32], 1]]]
multiplicity = ["-", "first_ecall"]
ref = "memmove:c:receive_ecall"

[[constraints.incoming]]
kind = "interaction"
tag = "COMMIT_DEFER"
input = ["timestamp", "src", "dst", "count"]
multiplicity = ["-", "first_commit"]
ref = "memmove:c:receive_commit_defer"

[[constraint_groups]]
name = "functionality"

[[constraints.functionality]]
kind = "arith"
constraint = "$#`is_set` dot #`is_commit` = 0$"
poly = ["*", "is_set", "is_commit"]
ref = "memmove:c:one_hot"

[[constraints.functionality]]
kind = "arith"
constraint = "$#`is_set` + #`is_commit` => #`μ` = 1$"
poly = ["*", ["+", "is_set", "is_commit"], ["not", "μ"]]
ref = "memmove:c:functionality_implies_mu"

[[constraints.functionality]]
kind = "arith"
constraint = "$#`first_ecall` = #`first` dot (1 - #`is_commit`)$"
poly = ["-", "first_ecall", ["*", "first", ["not", "is_commit"]]]
ref = "memmove:c:first_ecall"

[[constraints.functionality]]
kind = "arith"
constraint = "$#`commit_write` = (#`μ` - #`end`) dot #`is_commit`$"
poly = ["-", "commit_write", ["*", ["-", "μ", "end"], "is_commit"]]
ref = "memmove:c:commit_write"

[[constraints.functionality]]
kind = "arith"
constraint = "$#`commit_write_wide` = #`commit_write` dot (1 - #`tail`)$"
poly = ["-", "commit_write_wide", ["*", "commit_write", ["not", "tail"]]]
ref = "memmove:c:commit_write_wide"

[[constraint_groups]]
name = "read_input"

[[constraints.read_input]]
kind = "template"
tag = "REG"
input = [10, "dst", "timestamp"]
output = "dst"
cond = "first_ecall"
ref = "memmove:c:read_dst"

[[constraints.read_input]]
kind = "template"
tag = "REG"
input = [11, "src", "timestamp"]
output = "src"
cond = "first_ecall"
ref = "memmove:c:read_src"

[[constraints.read_input]]
kind = "template"
tag = "REG"
input = [12, "count", "timestamp"]
output = "count"
cond = "first_ecall"
ref = "memmove:c:read_count"

[[constraint_groups]]
name = "width"

[[constraints.width]]
kind = "interaction"
tag = "ALU"
input = ["count", ["cast", 8, "DWordWL"], ["opsel", "LT"]]
output = ["arr", "count_lt8", 0]
multiplicity = "μ"
ref = "memmove:c:short"

[[constraints.width]]
kind = "arith"
constraint = "$#`count_lt8` => #`tail` = 1$"
poly = ["*", ["not", "tail"], "count_lt8"]
ref = "memmove:c:wide_needs_eight"

[[constraints.width]]
kind = "interaction"
tag = "ALU"
input = ["count", ["cast", 257, "DWordWL"], ["opsel", "LT"]]
output = ["arr", 1, 0]
multiplicity = "first_ecall"
ref = "memmove:c:bound"

[[constraint_groups]]
name = "copy"

[[constraints.copy]]
kind = "interaction"
tag = "MEMW"
input = [0, "src", "value", ["+", "timestamp", 1, "is_set"], 0, 0, ["not", "tail"]]
output = "value"
multiplicity = ["-", "μ", "end"]
ref = "memmove:c:read_value"

[[constraints.copy]]
kind = "interaction"
tag = "MEMW"
input = [0, "dst", "value", ["-", ["+", "timestamp", 2], "is_set"], 0, 0, ["not", "tail"]]
multiplicity = "ram_write"
ref = "memmove:c:write_value"

[[constraints.copy]]
kind = "arith"
constraint = "$#`tail` => #`value`_i = 0$"
poly = ["*", "tail", ["idx", "value", "i"]]
iter = ["i", 1, 7]
ref = "memmove:c:tail_lanes"

[[constraints.copy]]
kind = "arith"
constraint = "$#`is_set` => #`dst`_0 = #`src`_0 + 8$"
poly = ["*", "is_set", ["-", ["idx", "dst", 0], ["idx", "src", 0], 8]]
ref = "memmove:c:set_gap_lo"

[[constraints.copy]]
kind = "arith"
constraint = "$#`is_set` => #`dst`_1 = #`src`_1$"
poly = ["*", "is_set", ["-", ["idx", "dst", 1], ["idx", "src", 1]]]
ref = "memmove:c:set_gap_hi"

[[constraint_groups]]
name = "commit"

[[constraints.commit]]
kind = "interaction"
tag = "memory"
input = [2, ["arr", ["+", ["idx", "dst", 0], "i"], ["idx", "dst", 1]], 0, ["idx", "value", "i"]]
iter = ["i", 0, 7]
multiplicity = ["idx", "commit_lane", "i"]
ref = "memmove:c:commit_value_out"

[[constraints.commit]]
kind = "interaction"
tag = "memory"
input = [2, ["arr", ["+", ["idx", "dst", 0], "i"], ["idx", "dst", 1]], 1, ["idx", "value", "i"]]
iter = ["i", 0, 7]
multiplicity = ["-", ["idx", "commit_lane", "i"]]
ref = "memmove:c:commit_value_in"

[[constraint_groups]]
name = "incr_decr"

[[constraints.incr_decr]]
kind = "template"
tag = "ADDNW"
input = ["src", ["arr", "step", 0]]
output = ["cast", "src_incr", "DWordWL"]
cond = ["-", "μ", "end"]
ref = "memmove:c:src_incr"

[[constraints.incr_decr]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "src_incr", "i"]]
iter = ["i", 0, 3]
multiplicity = "μ"
ref = "memmove:c:range_src_incr"

[[constraints.incr_decr]]
kind = "template"
tag = "ADDNW"
input = ["dst", ["arr", "step", 0]]
output = ["cast", "dst_incr", "DWordWL"]
cond = ["-", "μ", "end"]
ref = "memmove:c:dst_incr"

[[constraints.incr_decr]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "dst_incr", "i"]]
iter = ["i", 0, 3]
multiplicity = "μ"
ref = "memmove:c:range_dst_incr"

[[constraints.incr_decr]]
kind = "template"
tag = "SUB"
input = ["count", ["arr", "step", 0]]
output = ["cast", "count_decr", "DWordWL"]
ref = "memmove:c:count_decr"

[[constraints.incr_decr]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "count_decr", "i"]]
iter = ["i", 0, 3]
multiplicity = "μ"
ref = "memmove:c:range_count_decr"

[[constraint_groups]]
name = "end"

[[constraints.end]]
kind = "interaction"
tag = "ZERO"
input = [["+", ["-", 0xFFFF, ["idx", "count_decr", 0]], ["-", 0xFFFF, ["idx", "count_decr", 1]], ["-", 0xFFFF, ["idx", "count_decr", 2]], ["-", 0xFFFF, ["idx", "count_decr", 3]]]]
output = "end"
multiplicity = "μ"
ref = "memmove:c:end"

[[constraint_groups]]
name = "bits"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["first"]
ref = "memmove:c:range_first"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["end"]
ref = "memmove:c:range_end"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["tail"]
ref = "memmove:c:range_tail"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["count_lt8"]
ref = "memmove:c:range_count_lt8"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["is_set"]
ref = "memmove:c:range_is_set"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["is_commit"]
ref = "memmove:c:range_is_commit"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["μ"]
ref = "memmove:c:range_mu"

[[constraints.bits]]
kind = "arith"
constraint = "$#`first` + #`end` => #`μ` = 1$"
poly = ["*", ["+", "first", "end"], ["not", "μ"]]
ref = "memmove:c:first_or_end_implies_mu"

[[constraint_groups]]
name = "lookups"

[[constraints.lookups]]
kind = "interaction"
tag = "MEMMOVE_NEXT"
input = ["timestamp", ["cast", "src_incr", "DWordWL"], ["cast", "dst_incr", "DWordWL"], ["cast", "count_decr", "DWordWL"], "is_set", "is_commit"]
multiplicity = ["-", "μ", "end"]
ref = "memmove:c:send_next_chunk"

[[constraints.lookups]]
kind = "interaction"
tag = "MEMMOVE_NEXT"
input = ["timestamp", "src", "dst", "count", "is_set", "is_commit"]
multiplicity = ["-", ["-", "μ", "first"]]
ref = "memmove:c:receive_next_chunk"
