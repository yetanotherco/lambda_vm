name = "KECCAK_SPONGE"

# The KECCAK table's second mode: one row per permutation of a `keccak256` call
# (ECALL -5). The table holds both modes; this file lists the columns and the
# constraints of a sponge row (`μ_s = 1`). The mode bits and how they gate each
# mode are in keccak.typ.

[[variables.input]]
name = "key"
type = "DWordWL"
desc = "`(T, j)`: the call's timestamp `T` and the block index `j` (the table's `timestamp` columns)"
pad = 0

[[variables.input]]
name = "input_state"
type = [[["Byte", 8], 5], 5]
desc = "state the permutation starts from: the previous output with the padded block XORed into its rate"
pad = 0

[[variables.output]]
name = "output_state"
type = [[["Byte", 8], 5], 5]
desc = "state after the permutation"
pad = 0

[[variables.auxiliary]]
name = "count"
type = "BaseField"
desc = "input bytes left before this row's block (`len − 136·j`)"
pad = 0

[[variables.auxiliary]]
name = "src"
type = "DWordWL"
desc = "address of this row's block (`ptr + 136·j`)"
pad = 0

[[variables.auxiliary]]
name = "out"
type = "DWordWL"
desc = "address the digest is written to"
pad = 0

[[variables.auxiliary]]
name = "src_end"
type = ["Half", 2]
desc = "the low word of `src` plus 135, as two halves"
pad = 0

[[variables.auxiliary]]
name = "out_end"
type = ["Half", 2]
desc = "the low word of `out` plus 31, as two halves"
pad = 0

[[variables.auxiliary]]
name = "prev"
type = [["Byte", 8], 17]
desc = "rate lanes of the previous permutation's output (zero on the first row)"
pad = 0

[[variables.auxiliary]]
name = "msg"
type = [["Byte", 8], 17]
desc = "the block's bytes as read; zero past the input"
pad = 0

[[variables.auxiliary]]
name = "full"
type = ["Bit", 17]
desc = "lane `L` of the block is input and read as one 8-byte access"
pad = 0

[[variables.auxiliary]]
name = "part"
type = [["Bit", 7], 17]
desc = "byte `b < 7` of lane `L` is input and read alone"
pad = 0

[[variables.auxiliary]]
name = "first"
type = "Bit"
desc = "first row of a call"
pad = 0

[[variables.auxiliary]]
name = "last"
type = "Bit"
desc = "last row of a call"
pad = 0

[[variables.multiplicity]]
name = "μ_s"
type = "Bit"
desc = "sponge row (the table's `MU_S`)"
pad = 0

# Constraints

[[constraint_groups]]
name = "call"

[[constraints.call]]
kind = "interaction"
tag = "ECALL"
input = [["arr", ["idx", "key", 0], 0], ["cast", ["-", ["^", 2, 64], 5], "DWordWL"]]
multiplicity = ["-", "first"]
ref = "keccak_sponge:c:ecall"

[[constraints.call]]
kind = "interaction"
tag = "MEMW"
input = [1, ["cast", ["*", 2, 10], "DWordWL"], ["arr", ["idx", "src", 0], ["idx", "src", 1], 0, 0, 0, 0, 0, 0], ["arr", ["idx", "key", 0], 0], 1, 0, 0]
output = ["arr", ["idx", "src", 0], ["idx", "src", 1], 0, 0, 0, 0, 0, 0]
multiplicity = "first"
ref = "keccak_sponge:c:read_ptr"

[[constraints.call]]
kind = "interaction"
tag = "MEMW"
input = [1, ["cast", ["*", 2, 11], "DWordWL"], ["arr", "count", 0, 0, 0, 0, 0, 0, 0], ["arr", ["idx", "key", 0], 0], 1, 0, 0]
output = ["arr", "count", 0, 0, 0, 0, 0, 0, 0]
multiplicity = "first"
ref = "keccak_sponge:c:read_len"

[[constraints.call]]
kind = "interaction"
tag = "MEMW"
input = [1, ["cast", ["*", 2, 12], "DWordWL"], ["arr", ["idx", "out", 0], ["idx", "out", 1], 0, 0, 0, 0, 0, 0], ["arr", ["idx", "key", 0], 0], 1, 0, 0]
output = ["arr", ["idx", "out", 0], ["idx", "out", 1], 0, 0, 0, 0, 0, 0]
multiplicity = "first"
ref = "keccak_sponge:c:read_out"

[[constraints.call]]
kind = "arith"
constraint = "the first row is block 0"
poly = ["*", "first", ["idx", "key", 1]]
ref = "keccak_sponge:c:first_block"

[[constraints.call]]
kind = "arith"
constraint = "the first row starts from the zero state: `prev` is zero"
poly = ["*", "first", ["idx", ["idx", "prev", "L"], "b"]]
iters = [["L", 0, 16], ["b", 0, 7]]
ref = "keccak_sponge:c:first_prev"
[[constraints.call]]
kind = "arith"
constraint = "the first row starts from the zero state: capacity lanes of row 3"
poly = ["*", "first", ["idx", ["idx", ["idx", "input_state", "x"], 3], "b"]]
iters = [["x", 2, 4], ["b", 0, 7]]
ref = "keccak_sponge:c:first_capacity_3"

[[constraints.call]]
kind = "arith"
constraint = "the first row starts from the zero state: capacity lanes of row 4"
poly = ["*", "first", ["idx", ["idx", ["idx", "input_state", "x"], 4], "b"]]
iters = [["x", 0, 4], ["b", 0, 7]]
ref = "keccak_sponge:c:first_capacity_4"

[[constraints.call]]
kind = "arith"
constraint = "`first` and `last` only on sponge rows"
poly = ["*", ["+", "first", "last"], ["not", "μ_s"]]
ref = "keccak_sponge:c:flags_on_sponge_rows"

[[constraint_groups]]
name = "chain"
