output = ["arr", ["idx", "addr", 0], ["idx", "addr", 1], 0, 0, 0, 0, 0, 0]
multiplicity = "μ"

[[constraints.all]]
kind = "interaction"
tag = "MEMW"
input = [["+", 3, "d"], "addr", ["cast", 0, ["BaseField", 8]], "timestamp", 0, 0, 0]
output = ["cast", 0, ["BaseField", 8]]
multiplicity = "μ"
iter = ["d", 0, 2]

[[constraints.all]]
kind = "interaction"
tag = "ECALL"
input = ["timestamp", ["arr", ["-", ["^", 2, 32], 22], ["-", ["^", 2, 32], 1]]]

