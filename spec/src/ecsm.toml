name = "ECSM"

[[variables.input]]
name = "timestamp"
type = "DWordWL"
desc = "timestamp at which this operation is executed"

[[variables.input]]
name = "addr_xG"
type = "DWordWHH"
desc = "address at which `x`-coordinate of start point `G` is stored"

[[variables.input]]
name = "addr_k"
type = "DWordWHH"
desc = "address at which scalar `k` is stored"

[[variables.input]]
name = "addr_xR"
type = "DWordWHH"
desc = "address at which the `x`-coordinate of result point `R` is to be written"

[[variables.output]]
name = "xR"
type = "U256BL"
desc = "$(#`k` times #`G`)_x$"

[[variables.output]]
name = "yR"
type = "U256BL"
desc = "$(#`k` times #`G`)_y$"

[[variables.auxiliary]]
name = "k"
type = "U256BL"
desc = "`k`"

[[variables.auxiliary]]
name = "len_k"
type = "Byte"
desc = "Position of `k`'s most significant 1-bit"

[[variables.auxiliary]]
name = "xG"
type = "U256BL"
desc = "$x_G$"

[[variables.auxiliary]]
name = "yG"
type = "U256BL"
desc = "$y_G$"

[[variables.auxiliary]]
name = "x2"
type = "U256BL"
desc = "$x_G^2$"

[[variables.auxiliary]]
name = "q0"
type = "U256BL"
desc = "quotient for computing `x2`"

[[variables.auxiliary]]
name = "c0"
type = ["BaseField", 64]
desc = "carries for computing `x2`"

[[variables.auxiliary]]
name = "q1"
type = ["Byte", 33]
desc = "quotient for computing `yG`"

[[variables.auxiliary]]
name = "c1"
type = ["BaseField", 64]
desc = "carries for computing `yG`"

[[variables.auxiliary]]
name = "k_sub_N"
type = "U256HL"
desc = "$#`k`- #`N` mod 2^256$"

[[variables.auxiliary]]
name = "xR_sub_P"
type = "U256HL"
desc = "$#`xR`- #`P` mod 2^256$"

[[variables.virtual]]
name = "c2"
type = ["Bit", 8]
desc = "carries for computing $#`N` + #`k_sub_N`$"
def = {polys=[
    {iter=["i", 0], poly=["*", ["^", 2, -32], ["-", ["+", ["idx", ["cast", "N", "U256WL"], "i"], ["idx", ["cast", "k_sub_N", "U256WL"], "i"]], ["idx", ["cast", "k", "U256WL"], "i"]]]},
    {iter=["i", 1, 7], poly=["*", ["^", 2, -32], ["-", ["+", ["idx", ["cast", "N", "U256WL"], "i"], ["idx", ["cast", "k_sub_N", "U256WL"], "i"], ["idx", "c2", ["-", "i", 1]]], ["idx", ["cast", "k", "U256WL"], "i"]]]},
]}

[[variables.virtual]]
name = "c3"
type = ["Bit", 8]
desc = "carries for computing $#`P` + #`xR_sub_P`$"
def = {polys=[
    {iter=["i", 0], poly=["*", ["^", 2, -32], ["-", ["+", ["idx", ["cast", "p", "U256WL"], "i"], ["idx", ["cast", "xR_sub_P", "U256WL"], "i"]], ["idx", ["cast", "xG", "U256WL"], "i"]]]},
    {iter=["i", 1, 7], poly=["*", ["^", 2, -32], ["-", ["+", ["idx", ["cast", "p", "U256WL"], "i"], ["idx", ["cast", "xR_sub_P", "U256WL"], "i"], ["idx", "c3", ["-", "i", 1]]], ["idx", ["cast", "xG", "U256WL"], "i"]]]},
]}

[[variables.virtual]]
name = "XG"
type = ["Byte", 64]
desc = "zero-extension of `xG`"
def = {polys=[
    {iter=["i", 0, 31], poly=["idx", "xG", "i"]},
    {iter=["i", 32, 63], poly=0},
]}

[[variables.virtual]]
name = "YG"
type = ["Byte", 64]
desc = "zero-extension of `yG`"
def = {polys=[
    {iter=["i", 0, 31], poly=["idx", "yG", "i"]},
    {iter=["i", 32, 63], poly=0},
]}

[[variables.virtual]]
name = "X2"
type = ["Byte", 64]
desc = "zero-extension of `x2`"
def = {polys=[
    {iter=["i", 0, 31], poly=["idx", "x2", "i"]},
    {iter=["i", 32, 63], poly=0},
]}

[[variables.virtual]]
name = "Q0"
type = ["Byte", 64]
desc = "zero-extension of `q`"
def = {polys=[
    {iter=["i", 0, 31], poly=["idx", "q0", "i"]},
    {iter=["i", 32, 63], poly=0},
]}

[[variables.virtual]]
name = "Q1"
type = ["Byte", 64]
desc = "zero-extension of `q1`"
def = {polys=[
    {iter=["i", 0, 32], poly=["idx", "q1", "i"]},
    {iter=["i", 33, 63], poly=0},
]}

[[variables.virtual]]
name = "B"
type = ["Byte", 64]
desc = "zero-extension of `b`"
def = {polys=[
    {iter=["i", 0, 31], poly=["idx", "b", "i"]},
    {iter=["i", 32, 63], poly=0},
]}

[[variables.virtual]]
name = "P"
type = ["Byte", 64]
desc = "zero-extension of `p`"
def = {polys=[
    {iter=["i", 0, 31], poly=["idx", "p", "i"]},
    {iter=["i", 32, 63], poly=0},
]}

[[variables.constant]]
name = "b"
type = "U256BL"
desc = "`b`-coefficient of the elliptic curve"

[[variables.constant]]
name = "p"
type = "U256BL"
desc = "Prime field modulus"

[[variables.constant]]
name = "N"
type = "U256BL"
desc = "Curve order"

[[variables.multiplicity]]
name = "μ"
type = "Bit"
desc = ""



# Load xG from memory

[[constraint_groups]]
name = "read_xG"

[[constraints.read_xG]]
kind = "interaction"
tag = "MEMW"
input = [
    1, 
    ["cast", ["*", 2, 11], "DWordWL"],
    ["arr", ["+", ["idx", "addr_xG", 0], ["*", ["^", 2, 16], ["idx", "addr_xG", 1]]], ["idx", "addr_xG", 2], 0, 0, 0, 0, 0, 0],
    "timestamp", 
    1, 0, 0]
output = ["arr", ["+", ["idx", "addr_xG", 0], ["*", ["^", 2, 16], ["idx", "addr_xG", 1]]], ["idx", "addr_xG", 2], 0, 0, 0, 0, 0, 0]
multiplicity = "μ"
ref = "ec:c:read_addr_xG"

[[constraints.read_xG]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "addr_xG", "i"]]
iter = ["i", 0, 1]
multiplicity = "μ"
ref = "ec:c:range_xG"

[[constraints.read_xG]]
kind = "interaction"
tag = "IS_HALF"
input = [["+", ["idx", "addr_xG", 0], 24]]
multiplicity = "μ"
ref = "ec:c:verify_addr_xG_alignment"

[[constraints.read_xG]]
kind = "interaction"
tag = "MEMW"
input = [
    0,
    ["arr", ["+", ["idx", "addr_xG", 0], ["*", 8, "i"], ["*", ["^", 2, 16], ["idx", "addr_xG", 1]]], ["idx", "addr_xG", 2]],
    ["arr",
        ["idx", "xG", ["+", ["*", 8, "i"], 0]],
        ["idx", "xG", ["+", ["*", 8, "i"], 1]],
        ["idx", "xG", ["+", ["*", 8, "i"], 2]],
        ["idx", "xG", ["+", ["*", 8, "i"], 3]],
        ["idx", "xG", ["+", ["*", 8, "i"], 4]],
        ["idx", "xG", ["+", ["*", 8, "i"], 5]],
        ["idx", "xG", ["+", ["*", 8, "i"], 6]],
        ["idx", "xG", ["+", ["*", 8, "i"], 7]],
    ],
    "timestamp",
    0, 0, 1
]
output = ["arr",
    ["idx", "xG", ["+", ["*", 8, "i"], 0]],
    ["idx", "xG", ["+", ["*", 8, "i"], 1]],
    ["idx", "xG", ["+", ["*", 8, "i"], 2]],
    ["idx", "xG", ["+", ["*", 8, "i"], 3]],
    ["idx", "xG", ["+", ["*", 8, "i"], 4]],
    ["idx", "xG", ["+", ["*", 8, "i"], 5]],
    ["idx", "xG", ["+", ["*", 8, "i"], 6]],
    ["idx", "xG", ["+", ["*", 8, "i"], 7]],
]
iter = ["i", 0, 3]
multiplicity = "μ"
ref = "ec:c:read_xG"

# Computing xG^2

[[constraint_groups]]
name = "xG2"

[[constraints.xG2]]
kind = "template"
tag = "IS_BYTE"
input = [["idx", "x2", "i"]]
iter = ["i", 0, 31]
cond = "μ"
ref = "ec:c:range_x2"

[[constraints.xG2]]
kind = "template"
tag = "IS_BYTE"
input = [["idx", "q0", "i"]]
iter = ["i", 0, 31]
cond = "μ"
ref = "ec:c:range_q0"

[[constraints.xG2]]
kind = "arith"
constraint = "$2^8 dot #`c0`_0 = #`XG`_0 dot #`XG`_0 - #`X2`_0 - #`Q0`_0 dot #`P`_0$"
poly = ["-", ["*", ["idx", "XG", 0], ["idx", "XG", 0]], ["idx", "X2", 0], ["*", ["idx", "Q0", 0], ["idx", "P", 0]], ["*", ["^", 2, 8], ["idx", "c0", 0]]]
ref = "ec:c:c0_0"

[[constraints.xG2]]
kind = "arith"
constraint = "$2^8 dot #`c0`_i = #`c0`_(i-1) - #`X2`_i + sum_(j=0)^i #`XG`_j dot #`XG`_(i-j) - #`Q0`_j dot #`P`_(i-j)$"
poly = ["+", ["-", ["idx", "c0", ["-", "i", 1]], ["*", ["^", 2, 8], ["idx", "c0", "i"]], ["idx", "X2", "i"]], ["sum", ["=", "j", 0], "i", ["-", ["*", ["idx", "XG", "j"], ["idx", "XG", ["-", "i", "j"]]], ["*", ["idx", "Q0", "j"], ["idx", "P", ["-", "i", "j"]]]]]]
iter = ["i", 1, 63]
ref = "ec:c:c0_i"

[[constraints.xG2]]
kind = "arith"
constraint = "$#`c0`_63 = 0$"
poly = ["idx", "c0", 63]
ref = "ec:c:c0_63_is_zero"

[[constraints.xG2]]
kind = "interaction"
tag = "IS_HALF"
input = [["+", ["idx", "c0", "i"], 8160]]
iter = ["i", 0, 63]
multiplicity = "μ"
ref = "ec:c:range_c0"


# Computing yG

[[constraint_groups]]
name = "yG"

[[constraints.yG]]
kind = "template"
tag = "IS_BYTE"
input = [["idx", "yG", "i"]]
iter = ["i", 0, 31]
cond = "μ"
ref = "ec:c:range_yG"

[[constraints.yG]]
kind = "template"
tag = "IS_BYTE"
input = [["idx", "q1", "i"]]
iter = ["i", 0, 31]
cond = "μ"
ref = "ec:c:range_q1"

[[constraints.yG]]
kind = "template"
tag = "IS_BIT"
input = [["idx", "q1", 32]]
ref = "ec:c:q1_257"

[[constraints.yG]]
kind = "arith"
constraint = "$2^8 dot #`c1`_0 = #`YG`_0 dot #`YG`_0 - #`X2`_0 dot #`XG`_0 - #`B`_0 + #`P`_0 dot #`P`_0 - #`Q1`_0 dot #`P`_0$"
poly = ["-", 
    ["+", 
        ["*", ["idx", "YG", 0], ["idx", "YG", 0]], 
        ["*", ["idx", "P", 0], ["idx", "P", 0]], 
    ], 
    ["*", ["idx", "X2", 0], ["idx", "XG", 0]], 
    ["idx", "B", 0], 
    ["*", ["idx", "Q1", 0], ["idx", "P", 0]], 
    ["*", ["^", 2, 8], ["idx", "c1", 0]]
]

[[constraints.yG]]
kind = "arith"
constraint = "$2^8 dot #`c1`_i = #`c1`_(i-1) - #`B`_i + sum_(j=0)^i (#`YG`_j dot #`YG`_(i-j) + #`P`_j dot #`P`_(i-j) - #`X2`_j dot #`XG`_(i-j) - #`Q1`_j dot #`P`_(i-j))$"
poly = ["+", 
    ["-", 
        ["idx", "c1", ["-", "i", 1]], 
        ["idx", "B", "i"], 
        ["*", ["^", 2, 8], ["idx", "c1", "i"]]
    ], 
    ["sum", ["=", "j", 0], "i", 
        ["-", 
            ["+", 
                ["*", ["idx", "YG", "j"], ["idx", "YG", ["-", "i", "j"]]],
                ["*", ["idx", "P", "j"], ["idx", "P", ["-", "i", "j"]]]
            ], 
            ["*", ["idx", "X2", "j"], ["idx", "XG", ["-", "i", "j"]]], 
            ["*", ["idx", "Q1", "j"], ["idx", "P", ["-", "i", "j"]]]
        ]
    ]
]
iter = ["i", 1, 63]

[[constraints.yG]]
kind = "arith"
constraint = "$#`c1`_63 = 0$"
poly = ["idx", "c1", 63]
ref = "ec:c:c1_63_is_zero"

[[constraints.yG]]
kind = "interaction"
tag = "IS_HALF"
input = [["+", ["idx", "c1", "i"], 16318]]
iter = ["i", 0, 63]
multiplicity = "μ"
ref = "ec:c:range_c1"


# send/receive lookups for double/add sequence
# send lookup for table recursively loading & decomposing k from memory



# Verifying k


[[constraint_groups]]
name = "verify_k"

[[constraints.verify_k]]
kind = "interaction"
tag = "MEMW"
input = [
    1, 
    ["cast", ["*", 2, 12], "DWordWL"],
    ["arr", ["+", ["idx", "addr_k", 0], ["*", ["^", 2, 16], ["idx", "addr_k", 1]]], ["idx", "addr_k", 2], 0, 0, 0, 0, 0, 0],
    "timestamp", 
    1, 0, 0]
output = ["arr", ["+", ["idx", "addr_k", 0], ["*", ["^", 2, 16], ["idx", "addr_k", 1]]], ["idx", "addr_k", 2], 0, 0, 0, 0, 0, 0]
multiplicity = "μ"
ref = "ec:c:read_addr_k"

[[constraints.verify_k]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "addr_k", "i"]]
iter = ["i", 0, 1]
multiplicity = "μ"
ref = "ec:c:range_addr_k"

[[constraints.verify_k]]
kind = "interaction"
tag = "IS_HALF"
input = [["+", ["idx", "addr_k", 0], 32]]
multiplicity = "μ"
ref = "ec:c:verify_addr_k_alignment"

[[constraints.verify_k]]
kind = "interaction"
tag = "MEMW"
input = [
    0,
    ["arr", ["+", ["idx", "addr_k", 0], ["*", 8, "i"], ["*", ["^", 2, 16], ["idx", "addr_k", 1]]], ["idx", "addr_k", 2]],
    ["arr",
        ["idx", "k", ["+", ["*", 8, "i"], 0]],
        ["idx", "k", ["+", ["*", 8, "i"], 1]],
        ["idx", "k", ["+", ["*", 8, "i"], 2]],
        ["idx", "k", ["+", ["*", 8, "i"], 3]],
        ["idx", "k", ["+", ["*", 8, "i"], 4]],
        ["idx", "k", ["+", ["*", 8, "i"], 5]],
        ["idx", "k", ["+", ["*", 8, "i"], 6]],
        ["idx", "k", ["+", ["*", 8, "i"], 7]],
    ],
    "timestamp",
    0, 0, 1
]
output = ["arr",
    ["idx", "k", ["+", ["*", 8, "i"], 0]],
    ["idx", "k", ["+", ["*", 8, "i"], 1]],
    ["idx", "k", ["+", ["*", 8, "i"], 2]],
    ["idx", "k", ["+", ["*", 8, "i"], 3]],
    ["idx", "k", ["+", ["*", 8, "i"], 4]],
    ["idx", "k", ["+", ["*", 8, "i"], 5]],
    ["idx", "k", ["+", ["*", 8, "i"], 6]],
    ["idx", "k", ["+", ["*", 8, "i"], 7]],
]
iter = ["i", 0, 3]
multiplicity = "μ"
ref = "ec:c:load_k"

[[constraints.verify_k]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "k_sub_N", "i"]]
iter = ["i", 0, 15]
multiplicity = "μ"
ref = "ec:c:range_k_sub_N"

[[constraints.verify_k]]
kind = "template"
tag = "IS_BIT"
input = [["idx", "c2", "i"]]
iter = ["i", 0, 6]
ref = "ec:c:range_c2"

[[constraints.verify_k]]
kind = "arith"
constraint = "$#`c2`_7 = 1$"
poly = ["not", ["idx", "c2", 7]]
ref = "ec:c:k_lt_N"

[[constraints.verify_k]]
kind = "interaction"
tag = "ZERO"
input = [["+", 
    ["idx", "k", 0],
    ["idx", "k", 1],
    ["idx", "k", 2],
    ["idx", "k", 3],
    ["idx", "k", 4],
    ["idx", "k", 5],
    ["idx", "k", 6],
    ["idx", "k", 7],
    ["idx", "k", 8],
    ["idx", "k", 9],
    ["idx", "k", 10],
    ["idx", "k", 11],
    ["idx", "k", 12],
    ["idx", "k", 13],
    ["idx", "k", 14],
    ["idx", "k", 15],
    ["idx", "k", 16],
    ["idx", "k", 17],
    ["idx", "k", 18],
    ["idx", "k", 19],
    ["idx", "k", 20],
    ["idx", "k", 21],
    ["idx", "k", 22],
    ["idx", "k", 23],
    ["idx", "k", 24],
    ["idx", "k", 25],
    ["idx", "k", 26],
    ["idx", "k", 27],
    ["idx", "k", 28],
    ["idx", "k", 29],
    ["idx", "k", 30],
    ["idx", "k", 31]
]]
output = 0
multiplicity = "μ"
ref = "ec:c:k_gt_0"

# Range check xR

[[constraint_groups]]
name = "range_xR"

[[constraints.range_xR]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "xR_sub_P", "i"]]
iter = ["i", 0, 15]
multiplicity = "μ"
ref = "ec:c:range_xR_sub_P"

[[constraints.range_xR]]
kind = "template"
tag = "IS_BIT"
input = [["idx", "c3", "i"]]
iter = ["i", 0, 6]
ref = "ec:c:range_c3"

[[constraints.range_xR]]
kind = "arith"
constraint = "$#`c3`_7 = 1$"
poly = ["not", ["idx", "c3", 7]]
ref = "ec:c:xR_addition_overflows"


# Write R to memory

[[constraint_groups]]
name = "write_xR"

[[constraints.write_xR]]
kind = "interaction"
tag = "MEMW"
input = [
    1, 
    ["cast", ["*", 2, 10], "DWordWL"],
    ["arr", ["+", ["idx", "addr_xR", 0], ["*", ["^", 2, 16], ["idx", "addr_xR", 1]]], ["idx", "addr_xR", 2], 0, 0, 0, 0, 0, 0],
    "timestamp",
    1, 0, 0]
output = ["arr", ["+", ["idx", "addr_xR", 0], ["*", ["^", 2, 16], ["idx", "addr_xR", 1]]], ["idx", "addr_xR", 2], 0, 0, 0, 0, 0, 0]
multiplicity = "μ"
ref = "ec:c:load_addrR"

[[constraints.write_xR]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "addr_xR", "i"]]
iter = ["i", 0, 1]
multiplicity = "μ"
ref = "ec:c:range_addr_xR"

[[constraints.write_xR]]
kind = "interaction"
tag = "IS_HALF"
input = [["+", ["idx", "addr_xR", 0], 24]]
multiplicity = "μ"
ref = "ec:c:verify_addrR_alignment"

[[constraints.write_xR]]
kind = "interaction"
tag = "MEMW"
input = [
    0,
    ["arr", ["+", ["idx", "addr_xR", 0], ["*", 8, "i"], ["*", ["^", 2, 16], ["idx", "addr_xR", 1]]], ["idx", "addr_xR", 2]],
    ["arr",
        ["idx", "xR", ["+", ["*", 8, "i"], 0]],
        ["idx", "xR", ["+", ["*", 8, "i"], 1]],
        ["idx", "xR", ["+", ["*", 8, "i"], 2]],
        ["idx", "xR", ["+", ["*", 8, "i"], 3]],
        ["idx", "xR", ["+", ["*", 8, "i"], 4]],
        ["idx", "xR", ["+", ["*", 8, "i"], 5]],
        ["idx", "xR", ["+", ["*", 8, "i"], 6]],
        ["idx", "xR", ["+", ["*", 8, "i"], 7]],
    ],
    ["+", "timestamp", ["cast", 2, "DWordWL"]],
    0, 0, 1
]
iter = ["i", 0, 3]
multiplicity = "μ"
ref = "ec:c:write_xR"


[[constraint_groups]]
name = "ecall"

[[constraints.ecall]]
kind = "template"
tag = "IS_BIT"
input = ["μ"]
ref = "ec:c:mu_isbit"

[[constraints.ecall]]
kind = "interaction"
tag = "ECALL"
input = ["timestamp", ["arr", ["-", ["^", 2, 32], 3], ["-", ["^", 2, 32], 1]]]
multiplicity = ["-", "μ"]

[[constraint_groups]]
name = "delegate"

[[constraints.delegate]]
kind = "interaction"
tag = "SERVE_K"
input = [
    ["+", "timestamp", ["cast", 1, "DWordWL"]],
    ["cast", "addr_k", "DWordWL"],
    31
]
multiplicity = "μ"

[[constraints.delegate]]
kind = "interaction"
tag = "BIT"
input = ["timestamp", "len_k"]
multiplicity = ["-", "μ"]

[[constraints.delegate]]
kind = "interaction"
tag = "ECDAS"
input = ["timestamp", "xG", "yG", "xG", "yG", ["-", "len_k", 1], 0]
multiplicity = "μ"
ref = "ec:c:start_double_add"

[[constraints.delegate]]
kind = "interaction"
tag = "ECDAS"
input = ["timestamp", "xR", "yR", "xG", "yG", -1, 0]
multiplicity = ["-", "μ"]
ref = "ec:c:receive_double_add"
