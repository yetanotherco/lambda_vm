name = "PAGE"

# Input

[[variables.input]]
name = "offset"
type = "RowIndex"
desc = "The offset from the page base address."

[[variables.input]]
name = "init"
type = "Byte"
desc = "The initial value of this address. Can be replaced by a constant zero for zero-initialization"

[[variables.input]]
name = "fini"
type = "Byte"
desc = "The final value this address took"

[[variables.input]]
name = "timestamp"
type = "DWordWL"
desc = "The timestamp at which this address was last accessed"

# Virtual

[[variables.virtual]]
name = "address"
type = "DWordWL"
desc = "Adding `offset` to the page base address `page`. `page` is a constant with respect to a single instance of this table."
def = ["+", "page", ["cast", "offset", "DWordWL"]]


[[constraint_groups]]
name = "all"

[[constraints.all]]
kind = "interaction"
tag = "IS_BYTE"
input = ["init"]

[[constraints.all]]
kind = "interaction"
tag = "IS_BYTE"
input = ["fini"]

[[constraints.all]]
kind = "interaction"
tag = "memory"
input = [0, "address", 0, "init"]
multiplicity = -1

[[constraints.all]]
kind = "interaction"
tag = "memory"
input = [0, "address", "timestamp", "fini"]
multiplity = 1
