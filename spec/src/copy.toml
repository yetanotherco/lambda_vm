name = "COPY"
code = "CPY"

# Input

[[variables.input]]
name = "timestamp"
type = "Word"
desc = "timestamp at which the operation is requested"
pad = 0

# Auxiliary

[[variables.auxiliary]]
name = "value"
type = "DWordBL"
desc = "The bytes moved by this row; only moves $#`value`_0$ when $#`single` = 1$."
pad = 0

[[variables.auxiliary]]
name = "src"
type = "DWordWL"
desc = "Address of the first byte read by this row"
pad = 0

[[variables.auxiliary]]
name = "src_incr"
type = "DWordWHH"
desc = "$#`src` + #`step`$"
pad = 8

[[variables.auxiliary]]
name = "dst"
type = "DWordWL"
desc = "Address of the first byte written by this row."
pad = 0

[[variables.auxiliary]]
name = "dst_incr"
type = "DWordWHH"
desc = "$#`dst` + #`step`$"
pad = 8

[[variables.auxiliary]]
name = "count"
type = "DWordWL"
desc = "Number of bytes that still have to be moved, including those moved by this row"
pad = 8

[[variables.auxiliary]]
name = "count_decr"
type = "DWordWHH"
desc = "$#`count` - #`step`$"
pad = 0

[[variables.auxiliary]]
name = "first"
type = "Bit"
desc = "Whether this is the first row of this sequence"
pad = 0

[[variables.auxiliary]]
name = "end"
type = "Bit"
desc = "Whether this is the last row of this sequence"
pad = 0

[[variables.auxiliary]]
name = "single"
type = "Bit"
desc = "Whether this row moves a single byte rather than eight"
pad = 0

[[variables.auxiliary]]
name = "is_set"
type = "Bit"
desc = "Whether this row is part of a `memset`-sequence"
pad = 0

[[variables.auxiliary]]
name = "is_write"
type = "Bit"
desc = "Whether this row is part of a `commit`-sequence"
pad = 0

[[variables.auxiliary]]
name = "first_write"
type = "Bit"
desc = "$#`first` dot #`is_write`$; whether this row is the first of a `commit` sequence"
pad = 0

[[variables.auxiliary]]
name = "zc"
type = "Bit"
desc = "whether this sequence is a zero-copy"
pad = 0

[[variables.auxiliary]]
name = "dst_res"
type = "DWordWHH"
desc = "$#`dst` + #`count` dot #`is_write`$"
pad = 0

# Virtual

[[variables.virtual]]
name = "step"
type = "Byte"
desc = "The stride this row advances by: $1$ if `single` is set, or $8$ otherwise."
def = ["-", 8, ["*", 7, "single"]]

# Multiplicity

[[variables.multiplicity]]
name = "μ"
type = "Bit"
desc = ""
pad = 0

# Assumptions

[[assumptions]]
desc = "`IS_WORD[timestamp]`"
ref = "copy:a:timestamp"

[[assumptions]]
desc = "`IS_WORD[src[i]]`"
iter = ["i", 0, 1]
ref = "copy:a:src"

[[assumptions]]
desc = "`IS_WORD[dst[i]]`"
iter = ["i", 0, 1]
ref = "copy:a:dst"

[[assumptions]]
desc = "`IS_WORD[count[i]]`"
iter = ["i", 0, 1]
ref = "copy:a:count"

# Constraints

[[constraint_groups]]
name = "ecall"

[[constraints.ecall]]
kind = "interaction"
tag = "ECALL"
input = ["timestamp", ["arr", ["-", ["+", 64, ["*", ["-", ["^", 2, 32], 94], ["-", 1, "is_write"]]], "is_set"], ["*", ["*", ["-", ["^", 2, 32], 1], ["-", 1, "is_write"]]]]]
multiplicity = ["-", "first"]
ref = "copy:c:receive_ecall"

[[constraint_groups]]
name = "flags"

[[constraints.flags]]
kind = "template"
tag = "IS_BIT"
input = ["is_set"]
ref = "copy:c:range_is_set"

[[constraints.flags]]
kind = "template"
tag = "IS_BIT"
input = ["is_write"]
ref = "copy:c:range_is_write"

[[constraints.flags]]
kind = "arith"
constraint = "$#`is_set` dot #`is_write` = 0$"
poly = ["*", "is_set", "is_write"]
ref = "copy:c:one_hot"

[[constraint_groups]]
name = "functionality"

[[constraints.functionality]]
kind = "arith"
constraint = "$#`is_set` + #`is_write` => #`μ` = 1$"
poly = ["*", ["+", "is_set", "is_write"], ["not", "μ"]]
ref = "copy:c:functionality_implies_mu"

[[constraints.functionality]]
kind = "arith"
constraint = "$#`first_write` = #`first` dot #`is_write`$"
poly = ["-", "first_write", ["*", "first", "is_write"]]
ref = "copy:c:first_write"

[[constraint_groups]]
name = "read_input"

[[constraints.read_input]]
kind = "template"
tag = "REG"
input = [11, "src", "timestamp"]
output = "src"
cond = "first"
ref = "copy:c:read_src"

[[constraints.read_input]]
kind = "template"
tag = "REG"
input = [12, "count", "timestamp"]
output = "count"
cond = "first"
ref = "copy:c:read_count"

[[constraints.read_input]]
kind = "template"
tag = "REG"
input = [["+", 10, ["*", 244, "is_write"]], ["cast", "dst_res", "DWordWL"], "timestamp"]
output = "dst"
cond = "first"
ref = "copy:c:read_dst"

[[constraints.read_input]]
kind = "template"
tag = "ADD"
input = ["dst", "count"]
output = ["cast", "dst_res", "DWordWL"]
cond = "is_write"
ref = "copy:c:dst_res_is_write"

[[constraints.read_input]]
kind = "arith"
constraint = "$!#`is_write` => #`dst_res` = #`dst`$"
poly = ["*", "is_write", ["-", ["idx", ["cast", "dst_res", "DWordWL"], "i"], ["idx", "dst", "i"]]]
iter = ["i", 0, 1]
ref = "copy:c:dst_res_non_write"

[[constraints.read_input]]
kind = "template"
tag = "IS_WHH"
input = ["dst_res"]
cond = "is_write"
ref = "copy:c:range_dst_res"

[[constraints.read_input]]
kind = "template"
tag = "REG"
input = [10, "count", "timestamp"]
output = ["cast", 1, "DWordWL"]
cond = "first_write"
ref = "copy:c:read_fd"

[[constraint_groups]]
name = "forward"

[[constraints.forward]]
kind = "template"
tag = "ADD"
input = [["cast", "src", "DWordWL"], ["arr", "step", 0]]
output = ["cast", "src_incr", "DWordWL"]
ref = "copy:c:src_incr"

[[constraints.forward]]
kind = "template"
tag = "ADD"
input = [["cast", "dst", "DWordWL"], ["arr", "step", 0]]
output = ["cast", "dst_incr", "DWordWL"]
ref = "copy:c:dst_incr"

[[constraints.forward]]
kind = "template"
tag = "SUB"
input = [["cast", "count", "DWordWL"], ["arr", "step", 0]]
output = ["cast", "count_decr", "DWordWL"]
ref = "copy:c:count_decr"

[[constraints.forward]]
kind = "template"
tag = "IS_WHH"
input = ["src_incr"]
cond = "μ"
ref = "copy:c:range_src_incr"

[[constraints.forward]]
kind = "template"
tag = "IS_WHH"
input = ["dst_incr"]
cond = "μ"
ref = "copy:c:range_dst_incr"

[[constraints.forward]]
kind = "template"
tag = "IS_WHH"
input = ["count_decr"]
cond = "μ"
ref = "copy:c:range_count_decr"

[[constraints.forward]]
kind = "interaction"
tag = "COPY_NEXT"
input = ["timestamp", ["cast", "src_incr", "DWordWL"], ["cast", "dst_incr", "DWordWL"], ["cast", "count_decr", "DWordWL"], "is_set", "is_write"]
multiplicity = ["-", "μ", "end"]
ref = "copy:c:send_next_chunk"

[[constraints.forward]]
kind = "interaction"
tag = "COPY_NEXT"
input = ["timestamp", "src", "dst", "count", "is_set", "is_write"]
multiplicity = ["-", ["-", "μ", "first"]]
ref = "copy:c:receive_next_chunk"

[[constraint_groups]]
name = "restrict_end"

[[constraints.restrict_end]]
kind = "template"
tag = "IS_BIT"
input = ["zc"]

[[constraints.restrict_end]]
kind = "arith"
constraint = "$#`zc` => #`first`$"
poly = ["*", "zc", ["not", "first"]]
ref = "copy:c:zc_implies_first"

[[constraints.restrict_end]]
kind = "arith"
constraint = "$#`zc` => #`end`$"
poly = ["*", "zc", ["not", "end"]]
ref = "copy:c:zc_implies_end"

[[constraints.restrict_end]]
kind = "arith"
constraint = "$#`zc` => #`count` = 0$"
poly = ["*", "zc", ["idx", "count", "i"]]
iter = ["i", 0, 1]
ref = "copy:c:zc_implies_count_is_zero"

[[constraints.restrict_end]]
kind = "arith"
constraint = "$#`end` => #`zc` = 1 or floor.l #`count` / 2^32 floor.r = 0$"
poly = ["*", "end", ["not", "zc"], ["idx", "count", 1]]
ref = "copy:c:end_implies_count_is_step_or_zc_upper"

[[constraints.restrict_end]]
kind = "arith"
constraint = "$#`end` => #`zc` = 1 or #`count[0]` = #`step`$"
poly = ["*", "end", ["not", "zc"], ["-", ["idx", "count", 0], "step"]]
ref = "copy:c:end_implies_count_is_step_or_zc_lower"

[[constraint_groups]]
name = "copy"

[[constraints.copy]]
kind = "interaction"
tag = "MEMW"
input = [0, "src", "value", ["+", "timestamp", "is_set"], 0, 0, ["not", "single"]]
output = "value"
multiplicity = ["-", "μ", "zc"]
ref = "copy:c:read_value"

[[constraints.copy]]
kind = "interaction"
tag = "MEMW"
input = [["*", 2, "is_write"], "dst", "value", ["+", "timestamp", ["-", 1, "is_set"]], 0, 0, ["not", "single"]]
multiplicity = ["-", "μ", "zc"]
ref = "copy:c:write_value"

[[constraints.copy]]
kind = "arith"
constraint = "$#`single` => #`value`_i = 0$"
poly = ["*", "single", ["idx", "value", "i"]]
iter = ["i", 1, 7]
ref = "copy:c:single_lanes"

[[constraints.copy]]
kind = "template"
tag = "ADD"
input = ["src", ["arr", 8, 0]]
output = "dst"
cond = "is_set"
ref = "copy:c:set_gap"

[[constraint_groups]]
name = "bits"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["first"]
ref = "copy:c:range_first"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["end"]
ref = "copy:c:range_end"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["single"]
ref = "copy:c:range_single"

[[constraints.bits]]
kind = "template"
tag = "IS_BIT"
input = ["μ"]
ref = "copy:c:range_mu"

[[constraints.bits]]
kind = "arith"
constraint = "$#`first` + #`end` => #`μ` = 1$"
poly = ["*", ["+", "first", "end"], ["not", "μ"]]
ref = "copy:c:first_or_end_implies_mu"

