name = "DVRM"

# Input

[[variables.input]]
name = "n"
type = "DWordHL"
desc = "The numerator"
pad = ["^", 2, 63]

[[variables.input]]
name = "d"
type = "DWordHL"
desc = "The denominator"
pad = 1

[[variables.input]]
name = "signed"
type = "Bit"
desc = "Whether to interpret the input as signed (1) or unsigned (0) integers."
pad = 0


# Output

[[variables.output]]
name = "q"
type = "DWordHL"
desc = "The quotient; $#`n` / #`d`$ rounded towards zero."
pad = ["^", 2, 63]

[[variables.output]]
name = "r"
type = "DWordHL"
desc = "The remainder; $#`n` - #`q` #`d`$."
pad = 0

# Auxiliary

[[variables.auxiliary]]
name = "div_by_zero"
type = "Bit"
desc = "Whether $#`d`=0$."
pad = 0

[[variables.auxiliary]]
name = "overflow"
type = "Bit"
desc = "Whether $#`n` = -2^63$ and $#`d`=-1$."
pad = 0

[[variables.auxiliary]]
name = "n_sub_r"
type = "DWordHL"
desc = "$#`n`-#`r`$."
pad = ["^", 2, 63]

[[variables.auxiliary]]
name = "sign_n_sub_r"
type = "Bit"
desc = "Sign of `n_sub_r`."
pad = 1

[[variables.auxiliary]]
name = "sign_q"
type = "Bit"
desc = "Whether to interpret `q` as a signed (1) or unsigned (0) integer."
pad = 0

[[variables.auxiliary]]
name = "abs_r"
type = "DWordHL"
desc = "Absolute value of `r`."
pad = 0

[[variables.auxiliary]]
name = "abs_d"
type = "DWordHL"
desc = "Absolute value of `d`."
pad = 1

[[variables.auxiliary]]
name = "msb_r"
type = "Bit"
desc = "Most significant bit of `r`."
pad = 0

[[variables.auxiliary]]
name = "msb_n"
type = "Bit"
desc = "Most significant bit of `n`."
pad = 1

[[variables.auxiliary]]
name = "sign_r"
type = "Bit"
desc = "Sign of `r`."
pad = 0

[[variables.auxiliary]]
name = "sign_d"
type = "Bit"
desc = "Sign of `d`."
pad = 0

# Virtual

[[variables.virtual]]
name = "extended_n_sub_r"
type = ["Half", 8]
desc = "sign-extended value of `n_sub_r`."
def = {idx="i", polys = [
  {iter=[0, 3], poly=["idx", "n_sub_r", "i"]},
  {iter=[4, 7], poly=["*", 0xFFFF, "sign_n_sub_r"]}
]}
ref = "dvrm:v:extended_n_sub_r"

[[variables.virtual]]
name = "μ_sum"
type = "BaseField"
desc = "sum of multiplicities"
def = ["+", "μ_q", "μ_r"]


# Multiplicities

[[variables.multiplicity]]
name = "μ_q"
type = "Bit"
desc = ""
pad = 0

[[variables.multiplicity]]
name = "μ_r"
type = "Bit"
desc = ""
pad = 0


# Assumptions

[[assumptions]]
desc = "`IS_HALF[n[i]]`"
iter = ["i", 0, 3]
ref = "lt:a:range_n"

[[assumptions]]
desc = "`IS_HALF[d[i]]`"
iter = ["i", 0, 3]
ref = "lt:a:range_d"

[[assumptions]]
desc = "`IS_BIT<signed>`"
ref = "lt:a:range_signed"

# Constraints

[[constraint_groups]]
name = "sign_equality"

[[constraints.sign_equality]]
kind = "arith"
constraint = "$#`r` eq.not 0 and #`signed` => #`r_msb` = #`n_msb`$"
poly = ["*", ["sum", ["=", "i", 0], 3, ["idx", "r", "i"]], "signed", ["-", "r_msb", "n_msb"]]
ref = "dvrm:c:sign_r_equals_sign_n"

[[constraint_groups]]
name = "abs_diff"

[[constraints.abs_diff]]
kind = "interaction"
tag = "LT"
input = ["abs_r", "abs_d", 0]
output = ["not", "div_by_zero"]
multiplicity = "μ_sum"
ref ="dvrm:c:abs_r_lt_abs_d"

[[constraints.abs_diff]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "abs_r", "i"]]
iter = ["i", 0, 3]
multiplicity = "sign_r"
ref = "dvrm:c:abs_r_range_check"

[[constraints.abs_diff]]
kind = "template"
tag = "SUB"
input = [0, "r"]
output = "abs_r"
cond = "sign_r"
ref = "dvrm:c:abs_r_if_negative"

[[constraints.abs_diff]]
kind = "arith"
constraint = "$not#`sign_r` => #`abs_r[i]`=#`r[i]`$"
iter = ["i", 0, 3]
poly = ["*", ["-", 1, "sign_r"], ["-", ["idx", "abs_r", "i"], ["idx", "r", "i"]]]
ref = "dvrm:c:abs_r_if_nonnegative"

[[constraints.abs_diff]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "abs_d", "i"]]
iter = ["i", 0, 3]
multiplicity = "sign_d"
ref = "dvrm:c:abs_d_range_check"

[[constraints.abs_diff]]
kind = "template"
tag = "SUB"
input = [0, "d"]
output = "abs_d"
cond = "sign_d"
ref = "dvrm:c:abs_d_if_negative"

[[constraints.abs_diff]]
kind = "arith"
constraint = "$not#`sign_d` => #`abs_d[i]`=#`d[i]`$"
iter = ["i", 0, 3]
poly = ["*", ["-", 1, "sign_d"], ["-", ["idx", "abs_d", "i"], ["idx", "d", "i"]]]
ref = "dvrm:c:abs_d_if_nonnegative"

[[constraint_groups]]
name = "overflow"

[[constraints.overflow]]
kind = "arith"
iter = ["i", 0, 3]
constraint = "$#`overflow` => #`q[i]` = #`n[i]`$"
poly = ["*", "overflow", ["-", ["idx", "q", "i"], ["idx", "n", "i"]]]
ref = "dvrm:c:q_if_overflow"

[[constraints.overflow]]
kind = "arith"
constraint = "$#`sign_q` = #`signed` dot (1- #`overflow`)$"
poly = ["-", ["*", "signed", ["-", 1, "overflow"]], "sign_q"]
ref = "dvrm:c:sign_q"

[[constraints.overflow]]
kind = "template"
tag = "IsEqual"
input = [["=", "signed", 1], ["=", ["idx", "n", "0:3"], "[0, 0, 0]"], ["=", ["-", ["idx", "n", 3], ["*", ["^", 2, 15], "msb_n"]], 0], ["=", "msb_n", 1], ["=", "d", "[65535, 65535, 65535, 65535]"]]
output = "overflow"
cond = "μ_sum"
ref = "dvrm:c:overflow"

[[constraint_groups]]
name = "n_sub_r"

[[constraints.n_sub_r]]
kind = "arith"
constraint = "$not#`signed` and not#`msb_n` => not#`msb_r`$"
poly = ["*", ["not", "signed"], ["not", "msb_n"], "msb_r"]
ref = "dvrm:c:unsigned_implies_msb_r_lt_msb_n"

[[constraints.n_sub_r]]
kind = "interaction"
tag = "MSB16"
input = [["idx", "n_sub_r", 3]]
output = "sign_n_sub_r"
multiplicity = ["-", ["+", 1, "msb_r"], "msb_n"]
ref = "dvrm:c:sign_n_sub_r_eq_msb"

[[constraints.n_sub_r]]
kind = "arith"
constraint = "$1 + #`msb_r` - #`msb_n` = 0 => #`sign_n_sub_r` = #`signed`$"
poly = ["*", ["-", "msb_n", "msb_r"], ["-", "sign_n_sub_r", "signed"]]
tag = "SIGN"
input = [["idx", "n_sub_r", 3], "signed"]
output = "sign_n_sub_r"
ref = "dvrm:c:sign_n_sub_r_eq_signed"

[[constraints.n_sub_r]]
kind = "template"
tag = "SUB"
input = ["n", "r"]
output = "n_sub_r"
ref = "dvrm:c:n_sub_r"

[[constraints.n_sub_r]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "r", "i"]]
iter = ["i", 0, 3]
multiplicity = "μ_sum"
ref = "dvrm:c:r_range"

[[constraints.n_sub_r]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "n_sub_r", "i"]]
iter = ["i", 0, 3]
multiplicity = "μ_sum"
ref = "dvrm:c:n_sub_r_range"

[[constraint_groups]]
name = "equality"

[[constraints.equality]]
kind = "interaction"
tag = "MUL"
input = ["d", "signed", "q", "sign_q", 0]
output = ["idx", "extended_n_sub_r", "0:4"]
multiplicity = "μ_sum"
ref = "dvrm:c:mul_lower"

[[constraints.equality]]
kind = "interaction"
tag = "MUL"
input = ["d", "signed", "q", "sign_q", 1]
output = ["idx", "extended_n_sub_r", "4:8"]
multiplicity = "μ_sum"
ref = "dvrm:c:mul_upper"

[[constraints.equality]]
kind = "interaction"
tag = "IS_HALF"
input = [["idx", "q", "i"]]
iter = ["i", 0, 3]
multiplicity = "μ_sum"
ref = "dvrm:c:q_range"


[[constraint_groups]]
name = "defs"

[[constraints.defs]]
kind = "interaction"
tag = "MSB16"
input = [["idx", "n", 3]]
output = "msb_n"
multiplicity = "μ_sum"
ref = "dvrm:c:msb_n"

[[constraints.defs]]
kind = "interaction"
tag = "MSB16"
input = [["idx", "r", 3]]
output = "msb_r"
multiplicity = "μ_sum"
ref = "dvrm:c:msb_r"

[[constraints.defs]]
kind = "arith"
constraint = "$#`sign_r` = #`signed` dot #`msb_r`$"
poly = ["-", ["*", "signed", "msb_r"], "sign_r"]
ref = "dvrm:c:sign_r"

[[constraints.defs]]
kind = "template"
tag = "SIGN"
input = [["idx", "d", 3], "signed"]
output = "sign_d"
ref = "dvrm:c:sign_d"

[[constraints.defs]]
kind = "template"
tag = "IS_BIT"
input = ["μ_q"]
ref = "dvrm:c:is_bit_μ_q"

[[constraints.defs]]
kind = "template"
tag = "IS_BIT"
input = ["μ_r"]
ref = "dvrm:c:is_bit_μ_r"

[[constraint_groups]]
name = "div_by_zero"

[[constraints.div_by_zero]]
kind = "arith"
iter = ["i", 0, 3]
constraint = "$#`div_by_zero` => #`q[i]` = 65535$"
poly = ["*", "div_by_zero", ["-", ["idx", "q", "i"], 65535]]
ref = "dvrm:c:q_if_div_by_zero"

[[constraints.div_by_zero]]
kind = "template"
tag = "IsZero"
input = ["d"]
output = "div_by_zero"
ref = "dvrm:c:div_by_zero"
cond = "μ_sum"

[[constraint_groups]]
name = "output"
desc = "Each row contributes the following to the LogUp sum"

[[constraints.output]]
kind = "interaction"
tag = "DVRM"
input = ["n", "d", "signed", "0"]
output = "q"
multiplicity = "-μ_q"

[[constraints.output]]
kind = "interaction"
tag = "DVRM"
input = ["n", "d", "signed", "1"]
output = "r"
multiplicity = "-μ_r"