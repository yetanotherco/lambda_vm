name = "KECCAK_RND"

[[variables.input]]
name = "timestamp"
type = "DWordWL"
desc = "timestamp at which the permutation is performed"


[[variables.input]]
name = "round"
type = "BaseField"
desc = "index of the permutation round"

[[variables.input]]
name = "A"
type = [[["Byte", 8], 5], 5]
desc = "state at the start of executing the permutation"

[[variables.auxiliary]]
name = "Cxz"
type = [[["Byte", 8], 4], 5]
desc = "$:= xor_(i=0)^(y+1) #`A[x,i,z]`$"

[[variables.auxiliary]]
name = "Cxz_sub_1"
type = [["Byte", 8], 5]
desc = "$:= #`Cxz[x,` 3 #`,` (#`z`-1) mod 5 #`]`$"

[[variables.auxiliary]]
name = "Dxz"
type = [["Byte", 8], 5]
desc = "$:= #`Cxz[x,y,z]` xor #`Cxz[` (#`x` +1) mod 5, #`y`, (#`z`-1) mod 5 #`]`$"

[[variables.auxiliary]]
name = "A'"
type = [[["Byte", 8], 5], 5]
desc = "$θ(#`A`)$"

[[variables.auxiliary]]
name = "rot_left"
type = [[["Byte", 8], 5], 5]
desc = "todo"

[[variables.auxiliary]]
name = "rot_right"
type = [[["Byte", 8], 5], 5]
desc = "todo"

[[variables.auxiliary]]
name = "chi_ANDs"
type = [[["Byte", 8], 5], 5]
desc = "todo"

[[variables.auxiliary]]
name = "chi"
type = [[["Byte", 8], 5], 5]
desc = "$χ(#`theta`)$ = θ(#`A`)"

[[variables.auxiliary]]
name = "rc"
type = ["Byte", 8]
desc = "round constants"

[[variables.auxiliary]]
name = "iota"
type = ["Byte", 8]
desc = "state after applying `ɩ`."

[[variables.virtual]]
name = "out"
type = [[["Byte", 8], 5], 5]
desc = "state at the end of executing the permutation"
def = {polys=[
    {iters=[["x", 0], ["y", 0], ["z", 0, 7]], poly=["idx", "iota","z"]},
    {iters=[["x", 1, 5], ["y", 0], ["z", 0, 7]], poly=["idx",["idx",["idx","chi","x"],"y"],"z"]},
    {iters=[["x", 0], ["y", 1, 5], ["z", 0, 7]], poly=["idx",["idx",["idx","chi","x"],"y"],"z"]},
    {iters=[["x", 1, 5], ["y", 1, 5], ["z", 0, 7]], poly=["idx",["idx",["idx","chi","x"],"y"],"z"]}
]}

[[variables.virtual]]
name = "rho"
type = [[["Byte", 8], 5], 5]
desc = "state after applying `ρ`"
def = {iters=[["x", 0, 4], ["y", 0, 4], ["z", 0, 7]], poly=[
    "+", 
    ["*", 
        ["not", ["idx", ["idx", ["idx", "rbc", "x"], "y"], 0]],
        ["not", ["idx", ["idx", ["idx", "rbc", "x"], "y"], 1]],
        ["+",
            ["idx", ["idx", ["idx", "rot_left", "x"], "y"], "z"], 
            ["idx", ["idx", ["idx", "rot_right", "x"], "y"], ["mod", ["-", "z", 1], 8]],
        ]
    ],
    ["*", 
        ["idx", ["idx", ["idx", "rbc", "x"], "y"], 0],
        ["not", ["idx", ["idx", ["idx", "rbc", "x"], "y"], 1]],
        ["+",
            ["idx", ["idx", ["idx", "rot_left", "x"], "y"], ["mod", ["-", "z", 2], 8]], 
            ["idx", ["idx", ["idx", "rot_right", "x"], "y"], ["mod", ["-", "z", 3], 8]],
        ]
    ],
    ["*",
        ["not", ["idx", ["idx", ["idx", "rbc", "x"], "y"], 0]],
        ["idx", ["idx", ["idx", "rbc", "x"], "y"], 1],
        ["+",
            ["idx", ["idx", ["idx", "rot_left", "x"], "y"], ["mod", ["-", "z", 4], 8]], 
            ["idx", ["idx", ["idx", "rot_right", "x"], "y"], ["mod", ["-", "z", 5], 8]],
        ]
    ],
    ["*", 
        ["idx", ["idx", ["idx", "rbc", "x"], "y"], 0],
        ["idx", ["idx", ["idx", "rbc", "x"], "y"], 1],
        ["+",
            ["idx", ["idx", ["idx", "rot_left", "x"], "y"], ["mod", ["-", "z", 6], 8]], 
            ["idx", ["idx", ["idx", "rot_right", "x"], "y"], ["mod", ["-", "z", 7], 8]],
        ]
    ],
]}

[[variables.virtual]]
name = "pi"
type = [[["Byte", 8], 5], 5]
desc = "state after applying `π`"
def = {iters=[["x", 0, 4], ["y", 0, 4], ["z", 0, 7]], poly=["idx", ["idx", ["idx", "rho", ["mod", ["+", "x", ["*", 3, "y"]], 5]], "x"], "z"]}

[[variables.constant]]
name = "rnc"
type = [["Byte", 5], 5]
desc = "lower nibble of `ρ` constants"

[[variables.constant]]
name = "rbc"
type = [[["Bit", 2], 5], 5]
desc = "top two bits of `ρ` constants"

[[variables.multiplicity]]
name = "μ"
type = "Bit"
desc = ""


# Assumptions


# Constraints

[[constraint_groups]]
name = "io"

[[constraints.io]]
kind = "interaction"
tag = "KECCAK"
input = ["timestamp", "round", "A"]
multiplicity = ["-", "μ"]

[[constraints.io]]
kind = "interaction"
tag = "KECCAK"
input = ["timestamp", ["+", "round", 1], "out"]
multiplicity = "μ"

[[constraint_groups]]
name = "theta"

[[constraints.theta]]
kind = "interaction"
tag = "XOR_BYTE"
input = [["idx", ["idx", ["idx", "A", "x"], 0], "z"], ["idx", ["idx", ["idx", "A", "x"], 1], "z"]]
output = ["idx", ["idx", ["idx", "Cxz", "x"], 0], "z"]
iters = [["x", 0, 4], ["z", 0, 7]]
multiplicity = "μ"

[[constraints.theta]]
kind = "interaction"
tag = "XOR_BYTE"
input = [["idx", ["idx", ["idx", "Cxz", "x"], ["-", "y", 2]], "z"], ["idx", ["idx", ["idx", "A", "x"], "y"], "z"]]
output = ["idx", ["idx", ["idx", "Cxz", "x"], ["-", "y", 1]], "z"]
iters = [["x", 0, 4], ["y", 2, 4], ["z", 0, 7]]
multiplicity = "μ"

[[constraints.theta]]
kind = "interaction"
tag = "ROT"
input = [["cast", ["idx", ["idx", "Cxz", "x"], 3], "DWordWL"], 1]
output = ["cast", ["idx", "Cxz_rot", "x"], "DWordWL"]
iter = ["x", 0, 4]
multiplicity = "μ"

[[constraints.theta]]
kind = "interaction"
tag = "IS_BYTE"
input = [["idx", ["idx", "Cxz_rot", "x"], "z"]]
iters = [["x", 0, 4], ["z", 0, 7]]
multiplicity = "μ"

[[constraints.theta]]
kind = "interaction"
tag = "XOR_BYTE"
input = [["idx", ["idx", ["idx", "Cxz", "x"], 3], "z"], ["idx", ["idx", "Cxz_rot", "x"], "z"]]
output = ["idx", ["idx", "Dxz", "x"], "z"]
iters = [["x", 0, 4], ["z", 0, 7]]
multiplicity = "μ"

[[constraints.theta]]
kind = "interaction"
tag = "XOR_BYTE"
input = [["idx", ["idx", ["idx", "A", "x"], "y"], "z"], ["idx", ["idx", "Dxz", "x"], "z"]]
output = ["idx", ["idx", ["idx", "theta", "x"], "y"], "z"]
iters = [["x", 0, 4], ["y", 0, 4], ["z", 0, 7]]
multiplicity = "μ"

[[constraint_groups]]
name = "rho"

[[constraints.rho]]
kind = "interaction"
tag = "IS_BYTE"
input = [["idx", ["idx", ["idx", "rot_left", "x"], "y"], "z"]]
iters = [["x", 0, 4], ["y", 0, 4], ["z", 0, 7]]
multiplicity = "μ"

[[constraints.rho]]
kind = "interaction"
tag = "IS_BYTE"
input = [["idx", ["idx", ["idx", "rot_right", "x"], "y"], "z"]]
iters = [["x", 0, 4], ["y", 0, 4], ["z", 0, 7]]
multiplicity = "μ"

[[constraints.rho]]
kind = "interaction"
tag = "HWSL"
input = [["idx", ["cast", ["idx", ["idx", "theta", "x"], "y"], "DWordHL"], "z"], ["idx", ["idx", "rc", "x"], "y"]]
output = ["arr", ["idx", ["cast", ["idx", ["idx", "rot_left", "x"], "y"], "DWordHL"], "z"], ["idx", ["cast", ["idx", ["idx", "rot_right", "x"], "y"], "DWordHL"], "z"]]
iters = [["x", 0, 4], ["y", 0, 4], ["z", 0, 3]]
multiplicity = "μ"

[[constraint_groups]]
name = "chi"

[[constraints.chi]]
kind = "interaction"
tag = "AND_BYTE"
input = [["-", 255, ["idx", ["idx", ["idx", "pi", ["mod", ["+", "x", 1], 5]], "y"], "z"]], ["idx",["idx",["idx", "pi", ["mod", ["+", "x", 2], 5]], "y"], "z"]]
output = ["idx", ["idx", ["idx", "chi_ANDs", "x"], "y"], "z"]
iters = [["x", 0, 4], ["y", 0, 4], ["z", 0, 7]]
multiplicity = "μ"

[[constraints.chi]]
kind = "interaction"
tag = "XOR_BYTE"
input = [["idx", ["idx", ["idx", "rho", "x"], "y"], "z"], ["idx",["idx",["idx", "chi_ANDs", "x"], "y"], "z"]]
output = ["idx", ["idx", ["idx", "chi", "x"], "y"], "z"]
iters = [["x", 0, 4], ["y", 0, 4], ["z", 0, 7]]
multiplicity = "μ"

[[constraint_groups]]
name = "iota"

[[constraints.iota]]
kind = "interaction"
tag = "XOR_BYTE"
input = [["idx", ["idx", ["idx", "chi", 0], 0], "z"], ["idx","rc", "z"]]
output = ["idx", "iota", "z"]
iter = ["z", 0, 7]
multiplicity = "μ"
