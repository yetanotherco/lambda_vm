name: Formal model

on:
  push:
    branches: ["main"]
    paths: ["formal/**", ".github/workflows/formal.yml"]
  pull_request:
    paths: ["formal/**", ".github/workflows/formal.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean build and export check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: formal
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Clean and CompPoly are compiled from source; Mathlib comes from its own cache below.
      # One entry per toolchain and manifest: the cache holds the dependency builds, and
      # LambdaVM itself is rebuilt on top of them.
      - name: Cache Lake builds
        uses: actions/cache@v4
        with:
          path: |
            formal/.lake
            !formal/.lake/packages/mathlib
          key: lake-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}

      - name: Fetch Mathlib binaries
        run: lake exe cache get

      - name: Build
        run: lake build

      # `LambdaVM/Axioms.lean` is a list of `#print axioms` lines, one per modelled circuit and
      # per ensemble theorem. It is not part of the library, so `lake build` does not see it.
      - name: No sorry, no axioms beyond the standard three
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP:-/tmp}/axioms.txt"
          # `-Dformat.width` keeps each report on one line: the `sed` below needs the opening
          # `[` and the closing `]` of an axiom list on the same line to see it at all.
          lake env lean -Dformat.width=1000 LambdaVM/Axioms.lean | tee "$report"

          # One report per `#print axioms` line: a renamed or deleted declaration fails here
          # instead of quietly dropping out of the check.
          expected=$(grep -c '^#print axioms ' LambdaVM/Axioms.lean || true)
          got=$(grep -c 'depends on axioms\|does not depend on any axioms' "$report" || true)
          if [ "$expected" -ne "$got" ]; then
            echo "::error::expected $expected axiom reports, got $got"
            exit 1
          fi

          if grep -q 'sorryAx' "$report"; then
            echo "::error::a modelled circuit or ensemble theorem depends on sorry"
            exit 1
          fi

          unexpected=$(
            sed -n 's/.*depends on axioms: \[\(.*\)\]/\1/p' "$report" \
              | tr ',' '\n' | sed 's/[[:space:]]//g; /^$/d' | sort -u \
              | grep -vxF -e propext -e Classical.choice -e Quot.sound || true
          )
          if [ -n "$unexpected" ]; then
            echo "::error::axioms outside propext, Classical.choice, Quot.sound: $(echo $unexpected)"
            exit 1
          fi

          echo "$expected declarations checked, no sorry, no extra axioms"

      - name: Export is up to date
        run: |
          lake env lean --run LambdaVM/Export.lean
          git diff --exit-code -- export
          untracked=$(git ls-files --others --exclude-standard -- export)
          if [ -n "$untracked" ]; then
            echo "export files not committed:"
            echo "$untracked"
            exit 1
          fi
