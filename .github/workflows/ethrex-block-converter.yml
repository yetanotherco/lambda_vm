name: ethrex block-converter tests

# Validation for the real-block benchmark fixture and the converter that produces
# it. Deliberately NOT part of the required PR gate (pr_main.yaml): the fixture is a
# benchmark input, not a correctness input — no product code reads it — so it needs
# to be right when it changes, not on every PR. Running it there cost every PR a
# network download plus a cold build of ~335 packages (blst, c-kzg and secp256k1-sys
# C builds, malachite, ark-ff/asm).
#
# It fires on the things that can actually invalidate it: the fixture generator, the
# converter, the ethrex host-reference tests, and the Makefile (which holds the block
# pin, the cache URL and its sha256).
on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
    paths:
      - 'tooling/ethrex-fixtures/**'
      - 'tooling/ethrex-block-converter/**'
      - 'tooling/ethrex-ssz-input/**'
      - 'tooling/ethrex-tests/**'
      - 'Makefile'
      - '.github/workflows/ethrex-block-converter.yml'
  push:
    branches: ["main"]
    paths:
      - 'tooling/ethrex-fixtures/**'
      - 'tooling/ethrex-block-converter/**'
      - 'tooling/ethrex-ssz-input/**'
      - 'tooling/ethrex-tests/**'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  converter:
    name: Block converter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Own key, not pr_main.yaml's "lambda-vm-test": a shared key across jobs
          # that build different crate sets causes recompilation on both sides.
          shared-key: "lambda-vm-ethrex-block-converter"
          cache-all-crates: "true"
          # Detached workspace (own Cargo.lock, own target dir), so the default
          # `. -> target` would miss it and rebuild the ethrex tree every run.
          workspaces: |
            tooling/ethrex-block-converter -> target

      # Downloads the pinned ethrex-replay cache (the converter's test input) and runs
      # the crate's tests: the Amsterdam gate, the unmappable-network gate, and the
      # conversion itself over a cache patched to carry the Amsterdam fields, since every
      # published cache predates the fork and would be refused. So what the job pins is
      # that the crate still compiles, still refuses what it must and still encodes what
      # it accepts, against the pinned ethrex rev. Note these do NOT screen KZG — this
      # crate's graph links c-kzg via ethrex-config, so point evaluation (0x0a) resolves
      # here and to nothing in the guest. The block-usability job below covers that.
      - name: Run converter tests
        run: make test-ethrex-real-block-converter

      # Shares the converter's target dir (see the target), so this is the encoder's own
      # tests and not a second build of the ethrex host tree. They pin the guest output
      # layout the fixture producers read, which nothing else in CI covers.
      - name: Run the SSZ encoder's tests
        run: make test-ethrex-ssz-input

  block-usable:
    name: Real-block usability screen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "lambda-vm-real-block-usable"
          cache-all-crates: "true"
          workspaces: |
            tooling/ethrex-fixtures -> target
            tooling/ethrex-tests -> target

      # Built from the block's replay cache, not downloaded: the pinned guest decodes
      # only the Amsterdam schema, so no hosted artifact for a pre-Amsterdam block can
      # be valid. The generator validates the block through the guest before writing,
      # which is what the screen below then re-checks against the ELF. The guard covers
      # an unset cache URL, where failing the job would block PRs on an upload nobody
      # in the PR can perform.
      - name: Build real-block fixture
        id: fixture
        run: |
          if [ -z "$(make -s print-real-block-cache-url)" ]; then
            echo "::warning::ETHREX_REAL_BLOCK_CACHE_URL is unset — skipping the real-block usability screen. Set it in the Makefile once the cache is hosted."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          make ethrex-real-block-fixture
          echo "present=true" >> "$GITHUB_OUTPUT"

      # `test_ethrex_real_block_native` is the screen that makes a block USABLE rather
      # than merely realistic: this crate links no KZG backend (pinned by
      # `no_kzg_backend_linked`, which runs in pr_main.yaml), so a block calling point
      # evaluation (0x0a) diverges from consensus and fails here instead of silently
      # passing and then failing in the guest.
      #
      # `test_ethrex_real_block_vm` stays excluded: it drives the block through the
      # guest ELF, needs the RV64 toolchain, and its runtime is unmeasured.
      - name: Screen the block against the guest's precompile surface
        if: steps.fixture.outputs.present == 'true'
        run: |
          cd tooling/ethrex-tests && \
            cargo test --release test_ethrex_real_block_native -- --include-ignored

      # Same key as pr_main.yaml's, so this is normally a restore. The build step below
      # runs anyway: the ELF rule is FORCE-driven, so cargo decides, and a restore-keys
      # fallback could otherwise hand this job an ELF from another guest.
      - name: Cache compiled Rust ELF artifacts and build cache
        if: steps.fixture.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            executor/program_artifacts/rust
            executor/shared_target
          key: rust-elf-artifacts-${{ hashFiles('executor/programs/rust/**', 'executor/programs/riscv64im-lambda-vm-elf.json', 'syscalls/**', 'Makefile') }}
          restore-keys: |
            rust-elf-artifacts-

      - name: Compile the ethrex guest ELF
        if: steps.fixture.outputs.present == 'true'
        run: make executor/program_artifacts/rust/ethrex.elf

      # The real block THROUGH THE VM, compared against the native reference. This is the
      # only job that has both halves -- it builds the fixture above, and the PR gate has
      # no fixture to run against -- so until this step existed the block every benchmark
      # proves was never once executed by the VM in CI: `test_ethrex_real_block_vm` is
      # `#[ignore]`d, `make test-ethrex` skips it by name and the gate's `--skip
      # test_ethrex_real_block` substring drops it too. It is 30.5M cycles, seconds of
      # work, so the reason it stayed out was the missing fixture and not its cost.
      - name: Check the real block through the guest ELF
        if: steps.fixture.outputs.present == 'true'
        run: |
          cd tooling/ethrex-tests && \
            cargo test --release test_ethrex_real_block_vm -- --ignored
