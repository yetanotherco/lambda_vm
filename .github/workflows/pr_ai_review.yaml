name: AI Review

# Multi-model AI security review (yetanotherco/actions pr_review_multi.yml): Opus, GPT, Kimi, GLM and
# DeepSeek review the PR as read-only agents, a judge model checks every finding against the code,
# and one comment is posted. See docs/ai-review.md.
#
# Comment `/ai-review` (or `/review-ai`) on a PR, or add a label starting with `ai-review`.
# `/ai-review continue` reviews the parts a budget-limited review skipped; `/ai-review budget=80`
# raises the budget of one review (at most $100).

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  review:
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '/ai-review') || startsWith(github.event.comment.body, '/review-ai')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request' &&
        startsWith(github.event.label.name, 'ai-review') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    # Re-pin to the release tag's commit once yetanotherco/actions releases pr_review_multi.yml.
    uses: yetanotherco/actions/.github/workflows/pr_review_multi.yml@608b0eb7edac8a6c9b3ac2d74eafe354c2599b54 # feat/multi-model-review
    permissions:
      contents: read
      pull-requests: write
      actions: read
    with:
      command: /ai-review
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.AI_REVIEW_OPENROUTER_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
