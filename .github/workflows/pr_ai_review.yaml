name: AI Review

# Manual multi-model security review. The config and threat model are read from
# the PR base branch; label triggers can test this workflow before it is merged.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  review:
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       (github.event.comment.body == '/ai-review' ||
        startsWith(github.event.comment.body, '/ai-review ') ||
        startsWith(github.event.comment.body, fromJSON('"/ai-review\n"')) ||
        startsWith(github.event.comment.body, fromJSON('"/ai-review\r"')) ||
        github.event.comment.body == '/review-ai' ||
        startsWith(github.event.comment.body, '/review-ai ') ||
        startsWith(github.event.comment.body, fromJSON('"/review-ai\n"')) ||
        startsWith(github.event.comment.body, fromJSON('"/review-ai\r"')))) ||
      (github.event_name == 'pull_request' &&
       startsWith(github.event.label.name, 'ai-review') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: yetanotherco/actions/.github/workflows/pr_review_multi.yml@64982cac53d63b363bca163000efe3b158912c22 # v3.0.0
    permissions:
      contents: read
      pull-requests: write
      actions: read
    with:
      command: /ai-review
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
