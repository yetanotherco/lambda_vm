name: Bench ABBA tiebreaker

# Drift-free paired (A/B/B/A) prover benchmark for resolving small (~1%) deltas the
# cheap PR benchmark can't confirm. It builds both binaries and runs ~20 interleaved
# pairs — at the default workload that OCCUPIES THE SINGLE BENCH SERVER FOR SEVERAL
# HOURS (a 100tx continuations prove is ~7 min on a 16-core box). For that reason it
# NEVER auto-triggers -- it runs only on an explicit `/bench-abba` comment on a PR.
#
# Syntax: "/bench-abba [N] [cont[TX]|mono[TX]]" (N = pair count, default 20). The
# workload defaults to ethrex 100tx with --continuations — the production proving
# mode at a size where per-epoch effects amortize (63 epochs). "cont10" gives the
# small continuation workload (~45s/prove — good when a coarse answer fast matters
# more than resolution); "mono[TX]", e.g. "mono5", the legacy monolithic prove. The
# ~3.1 GiB cont100 proof requires rkyv pointer_width_64 on BOTH sides (see
# prover/Cargo.toml), so PR branches older than that fix must rebase before a cont100
# bench.
on:
  issue_comment:
    types: [created]

concurrency:
  # See bench-verify.yml. The single self-hosted bench runner serializes across PRs.
  group: ${{ startsWith(github.event.comment.body, '/bench-abba') && format('bench-abba-{0}', github.event.issue.number) || format('bench-abba-ignore-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  abba:
    # Manual-only: a "/bench-abba" comment on a PR, from a repo member. Never auto.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/bench-abba') &&
      contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: [self-hosted, bench]
    # Generous ceiling so a hang/OOM can't strand the single bench runner — not the
    # expected duration. Measured on a 16-core box: a 100tx-continuations CPU prove
    # is ~7 min, so the default 20 pairs (40 proves) runs ~4.5-5 hr and the 40-pair
    # clamp ceiling ~9.5 hr; builds add ~10-20 min. (The old 5tx-monolithic workload
    # was ~30-40 min total at 20 pairs.)
    timeout-minutes: 600
    steps:
      - name: Acknowledge (react + occupancy notice)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'eyes'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⏳ **ABBA tiebreaker started** on the bench server (~4-5 hr at the default 20 pairs of ethrex 100tx continuations; pass a smaller pair count or `cont10` for a quicker, coarser run). The bench server is occupied until it finishes.'
            });

      - name: Resolve PR head + bench config
        id: cfg
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # Resolve the head SHA (not the branch name): pinning the commit works for
          # fork PRs too (the branch lives in the fork, not origin/) and avoids a
          # force-push race mid-run.
          HEAD_SHA=$(gh pr view "$PR_NUM" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          # Everything after "/bench-abba" on its line, tokens in any order: a number =
          # pair count (default 20); cont[TX]/mono[TX] = workload. Default: ethrex 100tx
          # with --continuations — the production proving mode, where the epoch-level
          # optimizations (pipeline, K provers, cross-epoch caches) actually execute,
          # at a size (63 epochs) where per-epoch effects amortize. The old
          # 5tx-monolithic default never entered prove_continuation and under-reported
          # continuation PRs ~8x. "mono[TX]" keeps the legacy monolithic prove
          # reachable for historical comparison (TX defaults to 5).
          ARGS=$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -n 's|^/bench-abba||p' | head -n1)
          PAIRS=20; CONTINUATIONS=1; TX_COUNT=100
          for tok in $ARGS; do
            case "$tok" in
              cont)       CONTINUATIONS=1; TX_COUNT=100 ;;
              mono)       CONTINUATIONS=0; TX_COUNT=5 ;;
              cont[0-9]*) CONTINUATIONS=1; TX_COUNT="${tok#cont}" ;;
              mono[0-9]*) CONTINUATIONS=0; TX_COUNT="${tok#mono}" ;;
              [0-9]*)     PAIRS="$tok" ;;
              *)          echo "::warning::ignoring unrecognized token '$tok'" ;;
            esac
          done
          # Digits-only + clamps: TX_COUNT sizes the fixture (the 10-transfer one is
          # committed; others are generated on the runner); PAIRS is clamped to [2,40]
          # so a "/bench-abba 10000" can't monopolize the single bench server. The TX
          # ceiling is mode-aware: monolithic peak heap grows with the trace (20tx was
          # ~78 GB), so mono is capped at the classic 5; continuations are flat-memory,
          # capped at the validated 100.
          if [ "$CONTINUATIONS" = "1" ]; then TX_DEFAULT=100; TX_MAX=100; else TX_DEFAULT=5; TX_MAX=5; fi
          case "$TX_COUNT" in
            ''|*[!0-9]*) echo "::warning::invalid tx count '$TX_COUNT'; using $TX_DEFAULT"; TX_COUNT=$TX_DEFAULT ;;
          esac
          if [ "$TX_COUNT" -lt 1 ] || [ "$TX_COUNT" -gt "$TX_MAX" ]; then
            echo "::warning::tx count $TX_COUNT out of range [1,$TX_MAX] for this mode; using $TX_DEFAULT"
            TX_COUNT=$TX_DEFAULT
          fi
          case "$PAIRS" in
            ''|*[!0-9]*) echo "::warning::invalid pair count '$PAIRS'; using 20"; PAIRS=20 ;;
          esac
          if [ "$PAIRS" -lt 2 ] || [ "$PAIRS" -gt 40 ]; then
            echo "::warning::pair count $PAIRS out of range [2,40]; using 20"
            PAIRS=20
          fi
          if [ "$CONTINUATIONS" = "1" ]; then
            WORKLOAD="ethrex ${TX_COUNT}tx continuations"
          else
            WORKLOAD="ethrex ${TX_COUNT}tx monolithic"
          fi
          {
            echo "pairs=$PAIRS"
            echo "continuations=$CONTINUATIONS"
            echo "tx_count=$TX_COUNT"
            echo "workload=$WORKLOAD"
          } >> "$GITHUB_OUTPUT"
          echo "Using $PAIRS A/B/B/A pairs on $WORKLOAD"

      - name: Checkout (full history for ref resolution)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR head commit (works for fork PRs)
        env:
          PR_NUM: ${{ github.event.issue.number }}
        run: git fetch origin "pull/$PR_NUM/head" --quiet

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run ABBA tiebreaker
        id: run
        env:
          HEAD_SHA: ${{ steps.cfg.outputs.head_sha }}
          PAIRS: ${{ steps.cfg.outputs.pairs }}
          # Workload knobs read directly by bench_abba.sh from the environment.
          CONTINUATIONS: ${{ steps.cfg.outputs.continuations }}
          TX_COUNT: ${{ steps.cfg.outputs.tx_count }}
        run: |
          export SYSROOT_DIR="$HOME/.lambda-vm-sysroot"
          set -o pipefail
          # bench_abba.sh builds the cli at both refs (isolated worktree), runs the
          # interleaved pairs, and prints the paired-t CI + exact Wilcoxon test.
          # Pass the head SHA (pinned above) so fork PRs resolve.
          scripts/bench_abba.sh "$HEAD_SHA" origin/main "$PAIRS" 2>&1 | tee /tmp/abba_out.txt
          sed -n '/=== ABBA paired result/,$p' /tmp/abba_out.txt > /tmp/abba_result.txt

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.cfg.outputs.head_sha }}
          PAIRS: ${{ steps.cfg.outputs.pairs }}
          OUTCOME: ${{ steps.run.outcome }}
          WORKLOAD: ${{ steps.cfg.outputs.workload }}
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8').trim(); } catch { return ''; } };
            const head = (process.env.HEAD_SHA || '').slice(0, 10), pairs = process.env.PAIRS;
            const workload = process.env.WORKLOAD || 'ethrex';
            let body = `## ABBA tiebreaker — \`${head}\` vs \`main\` (${pairs} pairs, ${workload})\n\n`;
            if (process.env.OUTCOME === 'success') {
              const res = read('/tmp/abba_result.txt') || read('/tmp/abba_out.txt');
              body += '```\n' + res + '\n```\n';
              body += '\n<sub>Drift-free interleaved A/B/B/A measurement. - = PR faster. ';
              body += 'Trust the verdict when paired-t and Wilcoxon agree.</sub>\n';
            } else {
              const tail = read('/tmp/abba_out.txt').split('\n').slice(-30).join('\n');
              body += `❌ Run failed. Last log lines:\n\n` + '```\n' + tail + '\n```\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
