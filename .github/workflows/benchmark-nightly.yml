name: Benchmark (Nightly)

# Disabled initially — enable in GitHub UI when dedicated server is ready.
# Can always test via "Run workflow" button (workflow_dispatch).
on:
  schedule:
    - cron: '0 6 * * *'   # 3 AM Buenos Aires (UTC-3)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: [self-hosted, bench]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile benchmark ELF
        run: |
          mkdir -p executor/program_artifacts/asm
          ELF=executor/program_artifacts/asm/fib_iterative_744k.elf
          if [ ! -f "$ELF" ]; then
            clang --target=riscv64 -march=rv64im -fuse-ld=lld -nostdlib -Wl,-e,main \
              executor/programs/asm/fib_iterative_744k.s -o "$ELF"
          fi

      - name: Build CLI with jemalloc-stats
        run: cargo build --release -p cli --features jemalloc-stats

      - name: Run benchmark
        id: metrics
        run: |
          ./target/release/cli prove \
            executor/program_artifacts/asm/fib_iterative_744k.elf \
            -o /tmp/proof.bin --time | tee /tmp/cli_output.txt

          rm -f /tmp/proof.bin

          PEAK_MB=$(grep -o 'Peak heap: [0-9]*' /tmp/cli_output.txt | awk '{print $3}')
          TIME_S=$(grep -o 'Proving time: [0-9.]*' /tmp/cli_output.txt | awk '{print $3}')

          if [ -z "$PEAK_MB" ] || [ -z "$TIME_S" ]; then
            echo "::error::Failed to parse metrics from CLI output"
            cat /tmp/cli_output.txt
            exit 1
          fi

          echo "peak_mb=$PEAK_MB" >> "$GITHUB_OUTPUT"
          echo "time_s=$TIME_S" >> "$GITHUB_OUTPUT"

          echo "peak_mb=$PEAK_MB" > /tmp/metrics.txt
          echo "time_s=$TIME_S" >> /tmp/metrics.txt

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-metrics-${{ github.sha }}
          path: /tmp/metrics.txt
          retention-days: 90

      - name: Download previous nightly baseline
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            -w benchmark-nightly.yml -b main -s completed \
            --json databaseId,conclusion,createdAt \
            -q '[.[] | select(.conclusion=="success")][0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "::notice::No previous nightly found — establishing baseline"
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh run download "$RUN_ID" -D baseline/ -p "nightly-metrics-*"; then
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Failed to download baseline artifact"
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare with baseline
        id: compare
        if: steps.download.outputs.has_baseline == 'true'
        run: |
          BASELINE_FILE=$(ls -t baseline/*/metrics.txt 2>/dev/null | head -1)
          if [ -z "$BASELINE_FILE" ]; then
            echo "has_comparison=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASELINE_PEAK=$(grep 'peak_mb=' "$BASELINE_FILE" | cut -d= -f2)
          BASELINE_TIME=$(grep 'time_s=' "$BASELINE_FILE" | cut -d= -f2)
          CURRENT_PEAK=${{ steps.metrics.outputs.peak_mb }}
          CURRENT_TIME=${{ steps.metrics.outputs.time_s }}

          PEAK_DIFF=$((CURRENT_PEAK - BASELINE_PEAK))
          PEAK_PCT=$(awk "BEGIN { printf \"%.1f\", ($PEAK_DIFF * 100) / $BASELINE_PEAK }")
          TIME_PCT=$(awk "BEGIN { printf \"%.1f\", (($CURRENT_TIME - $BASELINE_TIME) * 100) / $BASELINE_TIME }")

          echo "has_comparison=true" >> "$GITHUB_OUTPUT"
          echo "baseline_peak=$BASELINE_PEAK" >> "$GITHUB_OUTPUT"
          echo "baseline_time=$BASELINE_TIME" >> "$GITHUB_OUTPUT"
          echo "peak_pct=$PEAK_PCT" >> "$GITHUB_OUTPUT"
          echo "time_pct=$TIME_PCT" >> "$GITHUB_OUTPUT"

          # Determine if notification is needed (>5% change either direction)
          ABS_PEAK=$(awk "BEGIN { v=$PEAK_PCT; print (v<0?-v:v) }")
          ABS_TIME=$(awk "BEGIN { v=$TIME_PCT; print (v<0?-v:v) }")
          NOTIFY=$(awk "BEGIN { print ($ABS_PEAK > 5 || $ABS_TIME > 5) }")

          if [ "$NOTIFY" -eq 1 ]; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
            # Determine if regression or improvement
            REGRESS=$(awk "BEGIN { print ($PEAK_PCT > 5 || $TIME_PCT > 5) }")
            if [ "$REGRESS" -eq 1 ]; then
              echo "status=regression" >> "$GITHUB_OUTPUT"
            else
              echo "status=improvement" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "status=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack notification
        if: steps.compare.outputs.notify == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_BENCHMARK_WEBHOOK }}
          STATUS: ${{ steps.compare.outputs.status }}
          PEAK_MB: ${{ steps.metrics.outputs.peak_mb }}
          TIME_S: ${{ steps.metrics.outputs.time_s }}
          BASELINE_PEAK: ${{ steps.compare.outputs.baseline_peak }}
          BASELINE_TIME: ${{ steps.compare.outputs.baseline_time }}
          PEAK_PCT: ${{ steps.compare.outputs.peak_pct }}
          TIME_PCT: ${{ steps.compare.outputs.time_pct }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::warning::SLACK_BENCHMARK_WEBHOOK not set — skipping notification"
            exit 0
          fi

          COMMIT=$(git rev-parse --short HEAD)
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          RUN_URL="$REPO_URL/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "regression" ]; then
            ICON="🔴"
            TITLE="Nightly Benchmark Regression"
          else
            ICON="🟢"
            TITLE="Nightly Benchmark Improvement"
          fi

          FMT_PEAK=$(awk "BEGIN { v=$PEAK_PCT; printf \"%+.1f\", v }")
          FMT_TIME=$(awk "BEGIN { v=$TIME_PCT; printf \"%+.1f\", v }")

          PAYLOAD=$(cat <<EOF
          {
            "text": "$ICON *$TITLE* (fib_iterative_744k)\n\n• Peak heap: ${BASELINE_PEAK} → ${PEAK_MB} MB (${FMT_PEAK}%)\n• Prove time: ${BASELINE_TIME} → ${TIME_S}s (${FMT_TIME}%)\n\nCommit: <$REPO_URL/commit/${{ github.sha }}|$COMMIT> · <$RUN_URL|View run>"
          }
          EOF
          )

          curl -s -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK"
