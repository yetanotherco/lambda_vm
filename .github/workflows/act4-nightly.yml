name: ACT4 Nightly

on:
  workflow_run:
    workflows: ["Bench Vs Nightly"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # TEMPORARY: remove before merging to main.
  # Manually trigger by adding the 'run-act4' label to a PR from this branch
  # (re-trigger: remove the label, then re-add it).
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: act4-nightly
  cancel-in-progress: false

jobs:
  act4:
    # TEMPORARY label gate: only fire on the 'run-act4' label.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-act4'
    runs-on: [self-hosted, bench]
    timeout-minutes: 360
    env:
      LAMBDAVM_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout zkevm-test-monitor
        uses: actions/checkout@v4
        with:
          repository: eth-act/zkevm-test-monitor
          ref: main

      - name: Pin lambdavm.commit to current main SHA
        run: |
          echo "Pinning lambdavm.commit to $LAMBDAVM_SHA"
          jq --arg sha "$LAMBDAVM_SHA" '.zkvms.lambdavm.commit = $sha' config.json > config.json.tmp
          mv config.json.tmp config.json
          jq '.zkvms.lambdavm' config.json

      - name: Build + test lambdavm
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p out
          ./run all lambdavm 2>&1 | tee out/run.log

      - name: Compute pass/fail from summaries
        id: summary
        if: always()
        run: |
          mkdir -p out
          {
            echo "## ACT4 results for lambdavm @ $LAMBDAVM_SHA"
            echo ""
            for f in test-results/lambdavm/summary-act4-*.json; do
              [ -f "$f" ] || continue
              jq -r '"- **\(.suite)**: \(.passed)/\(.total) passed (\(.failed) failed)"' "$f"
            done
          } | tee out/summary.md >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for f in test-results/lambdavm/summary-act4-*.json; do
            [ -f "$f" ] || continue
            n=$(jq '.failed // 0' "$f")
            FAILED=$((FAILED + n))
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "Total failed tests: $FAILED"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act4-results-${{ github.run_id }}
          path: |
            out/
            test-results/lambdavm/
          retention-days: 30

      - name: Open or update issue on failure
        if: steps.run.outcome == 'failure' || steps.summary.outputs.failed != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sha = process.env.LAMBDAVM_SHA;
            const shortSha = sha.substring(0, 8);
            const summary = fs.existsSync('out/summary.md')
              ? fs.readFileSync('out/summary.md', 'utf8')
              : '_summary not available_';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const labels = ['ci', 'act4-nightly', 'failed'];

            const body = [
              `## ACT4 nightly failure`,
              ``,
              `**Lambda VM commit:** \`${sha}\``,
              `**Workflow run:** ${runUrl}`,
              ``,
              summary,
              ``,
              `Logs and per-test results are attached to the workflow run as the \`act4-results-${context.runId}\` artifact.`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              console.log(`Commented on existing issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `ACT4 nightly failed @ ${shortSha}`,
                labels,
                body,
              });
              console.log(`Created issue #${created.data.number}`);
            }

      - name: Fail job on failure
        if: steps.run.outcome == 'failure' || steps.summary.outputs.failed != '0'
        run: |
          echo "ACT4 run failed (run outcome: ${{ steps.run.outcome }}, failed tests: ${{ steps.summary.outputs.failed }})"
          exit 1
