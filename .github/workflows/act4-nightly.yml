name: ACT4 Nightly

on:
  workflow_run:
    workflows: ["Bench Vs Nightly"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # TEMPORARY: remove before merging to main.
  # Manually trigger by adding the 'run-act4' label to a PR from this branch
  # (re-trigger: remove the label, then re-add it).
  pull_request:
    types: [labeled]

concurrency:
  group: act4-nightly
  cancel-in-progress: false

jobs:
  test:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'pull_request' || github.event.label.name == 'run-act4')
    runs-on: [self-hosted, bench]
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      LAMBDAVM_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Validate LAMBDAVM_SHA format
        run: |
          if [[ ! "$LAMBDAVM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid LAMBDAVM_SHA: $LAMBDAVM_SHA"
            exit 1
          fi

      - name: Scrub root-owned leftovers from previous Docker runs
        run: |
          if [ -d test-results ] || [ -d out ]; then
            docker run --rm -v "$PWD:/work" -w /work ubuntu:24.04 rm -rf test-results out
          fi

      - name: Checkout zkevm-test-monitor
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: eth-act/zkevm-test-monitor
          ref: c9e710b43448576920f7e841a2b68bab8b7a20f8

      - name: Pin lambdavm.commit to current main SHA
        run: |
          echo "Pinning lambdavm.commit to $LAMBDAVM_SHA"
          jq --arg sha "$LAMBDAVM_SHA" '.zkvms.lambdavm.commit = $sha' config.json > config.json.tmp
          mv config.json.tmp config.json
          jq '.zkvms.lambdavm' config.json

      - name: Build + test lambdavm
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p out
          ./run all lambdavm 2>&1 | tee out/run.log

      - name: Compute pass/fail from summaries
        id: summary
        if: always()
        run: |
          mkdir -p out
          shopt -s nullglob
          summaries=(test-results/lambdavm/summary-act4-*.json)

          # No summaries means the build/test pipeline failed to produce results.
          if [ ${#summaries[@]} -eq 0 ]; then
            msg="No ACT4 summary files were produced. See run.log."
            echo "$msg" | tee out/summary.md
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## ACT4 results for lambdavm @ $LAMBDAVM_SHA"
            echo ""
            for f in "${summaries[@]}"; do
              jq -r '"- **\(.suite)**: \(.passed)/\(.total) passed (\(.failed) failed)"' "$f"
            done
          } | tee out/summary.md >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for f in "${summaries[@]}"; do
            n=$(jq '.failed // 0' "$f")
            FAILED=$((FAILED + n))
          done
          echo "Total failed tests: $FAILED"
          if [ "${{ steps.run.outcome }}" = "failure" ]; then
            echo "./run exited non-zero"
            exit 1
          fi
          [ "$FAILED" -eq 0 ]

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: act4-results-${{ github.run_id }}
          path: |
            out/
            test-results/lambdavm/
          retention-days: 30

  report:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      LAMBDAVM_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Validate LAMBDAVM_SHA format
        run: |
          if [[ ! "$LAMBDAVM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid LAMBDAVM_SHA: $LAMBDAVM_SHA"
            exit 1
          fi

      - name: Download test artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: act4-results-${{ github.run_id }}

      - name: Open or update issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const sha = process.env.LAMBDAVM_SHA;
            const summary = fs.existsSync('out/summary.md')
              ? fs.readFileSync('out/summary.md', 'utf8')
              : '_summary not available_';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `## ACT4 nightly failure`,
              ``,
              `**Lambda VM commit:** \`${sha}\``,
              `**Workflow run:** ${runUrl}`,
              ``,
              summary,
              ``,
              `Logs and per-test results are attached to the workflow run as the \`act4-results-${context.runId}\` artifact.`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'act4-nightly',
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              console.log(`Commented on existing issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'ACT4 nightly failure',
                labels: ['act4-nightly'],
                body,
              });
              console.log(`Created issue #${created.data.number}`);
            }
