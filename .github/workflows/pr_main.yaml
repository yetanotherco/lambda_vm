name: Integration Tests
on:
  push:
    branches: ["main"]
  merge_group:
  pull_request:
    branches: ["**"]
    paths-ignore: ["spec/**"]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    # "Lint" is a required check, don't change the name
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-merge-queue[bot]'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check

      - name: Run cargo clippy
        run: |
          cargo clippy -- -D warnings

      - name: Run cargo fmt
        run: |
          cargo fmt --all -- --check

  test:
    # "Test" is a required check, don't change the name
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-merge-queue[bot]'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache compiled Rust ELF artifacts
        id: cache-elfs
        uses: actions/cache@v4
        with:
          path: executor/program_artifacts/rust
          key: elf-artifacts-${{ hashFiles('executor/programs/rust/**') }}

      - name: Compile Rust programs to ELF
        if: steps.cache-elfs.outputs.cache-hit != 'true'
        run: |
          cd executor && make compile-programs-rust

      - name: Run asm tests
        run: |
          cd executor && make test-asm-no-compile

      - name: Run rust tests (no compile)
        run: |
          cd executor && cargo test --test rust

      - name: Run prover tests
        run: |
          cd prover && cargo test
