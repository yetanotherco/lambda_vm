name: Integration Tests
on:
  push:
    branches: ["main"]
  merge_group:
  pull_request:
    branches: ["**"]
    paths-ignore: ["spec/**"]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    # "Lint" is a required check, don't change the name
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-merge-queue[bot]'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ""

      - name: Run cargo check
        run: cargo check

      - name: Run cargo clippy
        run: |
          cargo clippy -- -D warnings

      - name: Run cargo fmt
        run: |
          cargo fmt --all -- --check

  test:
    # "Test" is a required check, don't change the name
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-merge-queue[bot]'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Rust Environment
        uses: ./.github/actions/setup-rust

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ""

      - name: Cache compiled ASM ELF artifacts
        id: cache-asm-elfs
        uses: actions/cache@v4
        with:
          path: executor/program_artifacts/asm
          key: asm-elf-artifacts-${{ hashFiles('executor/programs/asm/**') }}

      - name: Compile ASM programs to ELF
        if: steps.cache-asm-elfs.outputs.cache-hit != 'true'
        run: |
          make compile-programs-asm

      - name: Cache compiled Rust ELF artifacts and build cache
        id: cache-rust-elfs
        uses: actions/cache@v4
        with:
          path: |
            executor/program_artifacts/rust
            executor/shared_target
          key: rust-elf-artifacts-${{ hashFiles('executor/programs/rust/**', 'executor/programs/riscv64im-lambda-vm-elf.json', 'syscalls/**') }}
          restore-keys: |
            rust-elf-artifacts-

      - name: Compile Rust programs to ELF
        if: steps.cache-rust-elfs.outputs.cache-hit != 'true'
        run: |
          make compile-programs-rust

      - name: Run asm tests (no compile)
        run: |
          make test-asm-no-compile

      - name: Run rust tests (no compile)
        run: |
          make test-rust-no-compile

      - name: Run prover and crypto tests
        run: |
          cargo test -p prover -p stark -p crypto ${{ github.event_name == 'merge_group' && '--release' || '' }}

      - name: Run comprehensive prover tests (merge queue only)
        if: github.event_name == 'merge_group'
        run: |
          cargo test -p prover --release test_prove_elfs_all_instructions_64_full -- --ignored
